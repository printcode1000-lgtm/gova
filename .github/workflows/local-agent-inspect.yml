name: local-agent-inspect

on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: "Short agent id for coordination output naming."
        required: true
        type: string
      mode:
        description: "Inspection mode."
        required: true
        default: "search"
        type: choice
        options:
          - read
          - search
          - list
          - git
      paths:
        description: "Comma or newline separated workspace paths, or __tracked__ for tracked files."
        required: false
        default: "__tracked__"
        type: string
      pattern:
        description: "Search pattern for search mode."
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 60
    env:
      GOVA_LOCAL_WORKSPACE: /home/hesham/gova
      GOVA_AGENT_COORDINATION_DIR: /home/hesham/github-runners/gova-coordination
      LOCAL_AGENT_ID: ${{ inputs.agent_id }}
      LOCAL_AGENT_INSPECT_MODE: ${{ inputs.mode }}
      LOCAL_AGENT_INSPECT_PATHS: ${{ inputs.paths }}
      LOCAL_AGENT_INSPECT_PATTERN: ${{ inputs.pattern }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Inspect local workspace
        run: npx tsx scripts/local-agent-inspect.ts
