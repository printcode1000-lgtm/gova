# Read-only inspection of the local workspace on behalf of a remote agent.
# Full file/search results stay local. Git mode additionally prints only safe
# repository metadata and tracked-change paths so remote recovery can be audited.
name: local-agent-inspect

on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: "Stable identifier of the requesting agent."
        required: true
        type: string
      mode:
        description: "Inspection mode."
        required: false
        default: search
        type: choice
        options:
          - search
          - read
          - list
          - git
      paths:
        description: "Comma or newline separated paths. Use __tracked__ for every tracked file."
        required: false
        default: __tracked__
        type: string
      pattern:
        description: "Search pattern, required for search mode."
        required: false
        type: string
      request_id:
        description: "Dispatch request id, set by the gateway."
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: /home/hesham/gova

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 30
    env:
      GOVA_LOCAL_WORKSPACE: /home/hesham/gova
      GOVA_AGENT_COORDINATION_DIR: /home/hesham/gova/.local/github-runners/gova-coordination
      LOCAL_AGENT_ID: ${{ inputs.agent_id }}
      LOCAL_AGENT_REQUEST_ID: ${{ inputs.request_id }}
      LOCAL_AGENT_INSPECT_MODE: ${{ inputs.mode }}
      LOCAL_AGENT_INSPECT_PATHS: ${{ inputs.paths }}
      LOCAL_AGENT_INSPECT_PATTERN: ${{ inputs.pattern }}
    steps:
      - name: Inspect the local workspace
        run: npx tsx scripts/local-agent-inspect.ts
      - name: Print safe git state
        if: ${{ inputs.mode == 'git' }}
        shell: bash
        run: |
          echo '===== branch ====='
          git branch --show-current
          echo '===== head ====='
          git rev-parse HEAD
          echo '===== origin/main ====='
          git rev-parse origin/main || true
          echo '===== tracked changes ====='
          git status --short --untracked-files=no
          echo '===== untracked count ====='
          git ls-files --others --exclude-standard | wc -l
