name: local-agent-direct-gateway-verify
on:
  push:
    branches: [main]
    paths:
      - 'tools/local-agent/.direct-gateway-bootstrap-trigger'
permissions:
  contents: read
jobs:
  install-and-verify:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Verify persistent direct gateway tunnel
        shell: bash
        run: |
          set -euo pipefail
          git -C /home/hesham/gova fetch --quiet origin integration
          git -C /home/hesham/gova-agents/integration reset --hard origin/integration
          test ! -e /home/hesham/gova-agents/integration/tools/local-agent/mcp_bridge.py
          test ! -e /home/hesham/.local/lib/gova-agent/mcp_bridge.py
          curl -fsS http://127.0.0.1:8765/health >/dev/null
          if ss -ltn | awk '{print $4}' | grep -Eq '(^|:)8767$'; then exit 1; fi
          pgrep -af cloudflared | grep -F -- '--url http://127.0.0.1:8765' >/dev/null
          systemctl --user is-active --quiet gova-agent-public.service
          systemctl --user is-enabled --quiet gova-agent-public.service
          if sudo -n systemctl is-active --quiet gova-agent-gateway.service; then
            sudo -n systemctl is-enabled --quiet gova-agent-gateway.service
            echo 'gateway=active-enabled(system)'
          else
            systemctl --user is-active --quiet gova-agent-gateway.service
            systemctl --user is-enabled --quiet gova-agent-gateway.service
            echo 'gateway=active-enabled(user)'
          fi
          URL="$(/home/hesham/.local/bin/gova-agent-public url)"
          test -n "$URL"
          DISCOVERY="$(/home/hesham/.local/bin/gova-agent-public publish)"
          echo "discovery=$DISCOVERY"
          DJ="$(curl -fsS --retry 5 --retry-all-errors --retry-delay 1 --max-time 15 "$DISCOVERY")"
          DJ="$DJ" URL="$URL" python3 -c "import json,os; x=json.loads(os.environ['DJ']); assert x['url']==os.environ['URL']; assert x['health']==os.environ['URL'].rstrip('/')+'/health'; assert not any(k.startswith('mcp') for k in x); print('direct_gateway=ok')"
