name: ui-identity-validation-one-shot

# Stage 67 rerun after migration hardening and zero-exception coverage cleanup.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-identity-validation-one-shot.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: UID coverage
        run: npm run ui-registry:uid-coverage:check
      - name: Generated catalog drift
        run: npm run ui-registry:generated-catalog:check
      - name: Component bridge drift
        run: npm run ui-registry:component-bridge:check
      - name: Static DOM IDs
        run: npm run ui-registry:static-dom-ids:check
      - name: UiRegistry tests
        run: npm run test:ui-registry-core
      - name: Architecture tests
        run: npm run test:architecture-core
      - name: Architecture gate
        run: npm run architecture:check
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Repository tests
        run: npm test
      - name: Docs validation
        run: npm run docs:ci
