# Coordination surface shared by cloud and local agents: identity, work
# declaration, heartbeat, scope locks, and short messages. Every action also
# republishes the sanitized snapshot to the agent-control branch, which is how a
# cloud agent reads this machine's state without touching it.
name: local-agent-coordination

on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: "Stable identifier of the requesting agent."
        required: true
        type: string
      action:
        description: "Coordination action."
        required: true
        type: choice
        options:
          - declare
          - heartbeat
          - lock
          - unlock
          - release-all
          - recover-stale-locks
          - message
          - status
          - publish
      scope:
        description: "Lock scope: a path, a module name, or a ref."
        required: false
        type: string
      scope_kind:
        description: "How the scope is interpreted."
        required: false
        default: path
        type: choice
        options:
          - path
          - module
          - ref
      task:
        description: "What this agent is working on."
        required: false
        type: string
      branch:
        description: "Branch this agent is working on."
        required: false
        type: string
      status:
        description: "Free-form status label for the agent record."
        required: false
        type: string
      message_kind:
        description: "Message kind."
        required: false
        default: note
        type: choice
        options:
          - editing
          - do-not-modify
          - dependency-changed
          - ready-for-merge
          - conflict-detected
          - lock-released
          - note
      message_body:
        description: "Message body, at most 500 characters and free of secrets."
        required: false
        type: string
      message_to:
        description: "Recipient agent id, or all."
        required: false
        default: all
        type: string
      request_id:
        description: "Dispatch request id, set by the gateway."
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: /home/hesham/gova

jobs:
  coordinate:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    env:
      GOVA_LOCAL_WORKSPACE: /home/hesham/gova
      GOVA_AGENT_COORDINATION_DIR: /home/hesham/gova/.local/github-runners/gova-coordination
      LOCAL_AGENT_ID: ${{ inputs.agent_id }}
      LOCAL_AGENT_REQUEST_ID: ${{ inputs.request_id }}
      LOCAL_AGENT_COORDINATION_ACTION: ${{ inputs.action }}
      LOCAL_AGENT_COORDINATION_PUBLISH: "1"
      LOCAL_AGENT_SCOPE: ${{ inputs.scope }}
      LOCAL_AGENT_SCOPE_KIND: ${{ inputs.scope_kind }}
      LOCAL_AGENT_TASK: ${{ inputs.task }}
      LOCAL_AGENT_BRANCH: ${{ inputs.branch }}
      LOCAL_AGENT_STATUS_LABEL: ${{ inputs.status }}
      LOCAL_AGENT_MESSAGE_KIND: ${{ inputs.message_kind }}
      LOCAL_AGENT_MESSAGE_BODY: ${{ inputs.message_body }}
      LOCAL_AGENT_MESSAGE_TO: ${{ inputs.message_to }}
      LOCAL_AGENT_ORIGIN: cloud
    steps:
      - name: Run the coordination action and publish the snapshot
        run: npx tsx scripts/local-agent-coordination.ts
