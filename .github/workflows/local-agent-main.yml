# Direct main update by a local agent. All mutation workflows share one GitHub
# concurrency group, so queued work waits before consuming a self-hosted runner.
# Work happens in an isolated worktree rebased on the freshest origin/main.
name: local-agent-main

on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: "Stable identifier of the requesting agent."
        required: false
        default: agent
        type: string
      patch_base64:
        description: "Base64-encoded git diff to apply. Optional when a shell command is supplied."
        required: false
        type: string
      commit_message:
        description: "Commit message for the direct main update."
        required: true
        type: string
      verification:
        description: "Allowed verification command."
        required: false
        default: "github-ci-policy"
        type: choice
        options:
          - github-ci-policy
          - runtime-check
          - docs-ci
          - architecture-check
          - typecheck
          - lint
          - none
      shell_command:
        description: "Optional shell command. Antigravity/agy is permanently forbidden."
        required: false
        type: string
      scopes:
        description: "Comma or newline separated paths to lock for the duration of this job."
        required: false
        type: string
      execution_target:
        description: "Execute in an isolated worktree or the canonical host checkout."
        required: false
        default: isolated-worktree
        type: choice
        options:
          - isolated-worktree
          - canonical-host
      timeout_minutes:
        description: "Per shell/verification command deadline, 1-55 minutes."
        required: false
        default: "15"
        type: string
      request_id:
        description: "Dispatch request id, set by the gateway."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: asol-local-agent-mutation
  cancel-in-progress: false

defaults:
  run:
    working-directory: /home/hesham/gova

jobs:
  apply-and-push:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 60
    env:
      GOVA_LOCAL_WORKSPACE: /home/hesham/gova
      GOVA_AGENT_COORDINATION_DIR: /home/hesham/gova/.local/github-runners/gova-coordination
      GOVA_AGENT_MAX_CONCURRENT_MUTATIONS: "1"
      LOCAL_AGENT_ID: ${{ inputs.agent_id }}
      LOCAL_AGENT_REQUEST_ID: ${{ inputs.request_id }}
      LOCAL_AGENT_PATCH_BASE64: ${{ inputs.patch_base64 }}
      LOCAL_AGENT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
      LOCAL_AGENT_VERIFICATION: ${{ inputs.verification }}
      LOCAL_AGENT_SHELL_COMMAND: ${{ inputs.shell_command }}
      LOCAL_AGENT_SCOPES: ${{ inputs.scopes }}
      LOCAL_AGENT_EXECUTION_TARGET: ${{ inputs.execution_target }}
      LOCAL_AGENT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
      LOCAL_AGENT_TARGET_MODE: main
    steps:
      - name: Apply, verify, commit, and push main
        run: npx tsx scripts/local-agent-main-apply.ts
