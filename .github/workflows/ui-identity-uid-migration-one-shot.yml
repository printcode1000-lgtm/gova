name: ui-identity-uid-migration-one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-identity-uid-migration-one-shot.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply canonical UID migration
        run: npm run ui-registry:uid-migration:apply
      - name: Regenerate canonical UiRegistry artifacts
        run: |
          npm run ui-registry:generated-catalog:generate
          npm run ui-registry:component-bridge:generate
          npm run ui-registry:simulation:generate
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src packages
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "Apply canonical UID migration to remaining actionable sites"
          git push origin HEAD:main
