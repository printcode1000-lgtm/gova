name: ui-identity-stage123-multiplicity-edge-diagnostics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-identity-stage113-forwarding-seams.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Print multiplicity edge witnesses
        run: npx tsx scripts/ui-registry/debug-runtime-multiplicity-edges.ts
