name: ui-identity-stage125-single-ui-source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-identity-stage113-forwarding-seams.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply Stage 124 patch
        run: node scripts/ui-registry/fix-stage124-single-ui-source.mjs
      - name: Regenerate canonical UiRegistry artifacts
        run: |
          npm run ui-registry:generated-catalog:generate
          npm run ui-registry:component-bridge:generate
          npm run ui-registry:simulation:generate
      - name: Verify UI identity contracts
        run: |
          npm run ui-registry:uid-coverage:check
          npm run ui-registry:generated-catalog:check
          npm run ui-registry:component-bridge:check
          npm run ui-registry:static-dom-ids:check
          npm run test:architecture-core
          npm run typecheck
      - name: Commit Stage 125 migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src packages
          if git diff --cached --quiet; then
            echo "No Stage 125 changes"
            exit 0
          fi
          git commit -m "Stage 125: enforce one UI descriptor source per element"
          git push origin HEAD:main
