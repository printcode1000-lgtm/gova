name: ui-identity-stage126-branch-aware-multiplicity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-identity-stage113-forwarding-seams.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify Stage 126 contracts
        run: |
          npm run test:architecture-core
          npm run typecheck
          npm run ui-registry:uid-coverage:check
      - name: Measure corrected runtime multiplicity
        run: |
          npx tsx scripts/ui-registry/runtime-multiplicity-summary.ts
          npx tsx scripts/ui-registry/runtime-multiplicity-audit.ts
