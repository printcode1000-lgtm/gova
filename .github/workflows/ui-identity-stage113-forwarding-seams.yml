name: ui-identity-stage122-render-graph-multiplicity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-identity-stage113-forwarding-seams.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify architecture-core render graph model
        run: npm run test:architecture-core
      - name: Verify identity contracts
        run: |
          npm run ui-registry:uid-coverage:check
          npm run ui-registry:generated-catalog:check
          npm run ui-registry:component-bridge:check
          npm run ui-registry:static-dom-ids:check
          npm run typecheck
      - name: Measure runtime multiplicity
        run: npx tsx scripts/ui-registry/runtime-multiplicity-summary.ts
