name: tmp-local-agent-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/__tmp-local-agent-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Audit UI multiplicity locally
        shell: bash
        run: |
          set -euo pipefail
          cd /home/hesham/gova
          git fetch --prune origin main >/dev/null 2>&1
          git checkout main >/dev/null 2>&1
          git reset --hard origin/main >/dev/null 2>&1
          echo "HEAD=$(git rev-parse HEAD)"
          npx tsx scripts/ui-registry/runtime-multiplicity-audit.ts > /tmp/ui-multiplicity.txt
          head -n 8 /tmp/ui-multiplicity.txt
          echo '--- grouped by reason ---'
          awk '/^UNRESOLVED / {c[$2]++} END {for (k in c) print k, c[k]}' /tmp/ui-multiplicity.txt | sort
          echo '--- top files ---'
          awk '/^UNRESOLVED / {split($3,a,":"); c[a[1]]++} END {for (k in c) print c[k], k}' /tmp/ui-multiplicity.txt | sort -nr | head -n 40
          echo '--- top reusable components ---'
          awk '/^UNRESOLVED reusable-template / {sub(/^.*component=/,""); c[$0]++} END {for (k in c) print c[k], k}' /tmp/ui-multiplicity.txt | sort -nr | head -n 40
          echo '--- migration scripts ---'
          find scripts/ui-registry -maxdepth 2 -type f \( -name '*fix*' -o -name '*migrat*' -o -name '*multiplicity*' \) -print | sort
