name: tmp-local-agent-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/__tmp-local-agent-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 5
    steps:
      - name: Probe local coding tools
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_NAME"
          echo "workspace_env=${GOVA_LOCAL_WORKSPACE:-unset}"
          echo "node=$(node --version 2>/dev/null || echo missing)"
          echo "npm=$(npm --version 2>/dev/null || echo missing)"
          for tool in codex claude cursor-agent gemini; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool=$(command -v "$tool")"
              "$tool" --version 2>/dev/null | head -n 1 || true
            else
              echo "$tool=missing"
            fi
          done
          if [ -d /home/hesham/gova/.git ]; then
            echo "local_head=$(git -C /home/hesham/gova rev-parse HEAD)"
            echo "local_branch=$(git -C /home/hesham/gova branch --show-current)"
            echo "local_dirty=$(git -C /home/hesham/gova status --porcelain | wc -l)"
          else
            echo "local_workspace_missing"
          fi
