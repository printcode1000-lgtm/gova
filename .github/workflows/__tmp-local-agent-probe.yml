name: tmp-local-agent-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/__tmp-local-agent-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Inspect real local control-plane files
        shell: bash
        run: |
          set -euo pipefail
          cd /home/hesham/gova
          git fetch --prune origin main >/dev/null 2>&1
          git checkout main >/dev/null 2>&1
          git reset --hard origin/main >/dev/null 2>&1
          echo "HEAD=$(git rev-parse HEAD)"
          echo "BRANCH=$(git branch --show-current)"
          echo "DIRTY=$(git status --porcelain | wc -l)"
          echo '--- control files ---'
          for f in \
            .github/workflows/local-agent-status.yml \
            .github/workflows/local-agent-inspect.yml \
            .github/workflows/local-agent-main.yml \
            .github/workflows/local-agent-workspace.yml \
            .github/workflows/deploy-main.yml \
            scripts/local-agent-status.ts \
            scripts/local-agent-inspect.ts \
            scripts/local-agent-main-apply.ts \
            docs/07-mobile-and-release/local-agent-runner-pool.md; do
            if [ -f "$f" ]; then
              printf '%s\t%s\t%s bytes\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f" "$(stat -c %s "$f")"
            else
              echo "MISSING $f"
            fi
          done
          echo '--- coordination directory ---'
          find /home/hesham/github-runners/gova-coordination -maxdepth 2 -type d -printf '%p\n' 2>/dev/null | sort | head -n 80 || true
          echo '--- active runner services ---'
          systemctl --user list-units 'gova-github-runner*' --no-pager --all || true
          echo '--- local-agent workflow triggers ---'
          grep -nE 'workflow_dispatch|runs-on:|npm ci|GOVA_LOCAL_WORKSPACE|concurrency|shell_command' .github/workflows/local-agent-*.yml || true
          echo '--- deploy-main trigger header ---'
          sed -n '1,35p' .github/workflows/deploy-main.yml
