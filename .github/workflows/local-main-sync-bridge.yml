name: local-main-sync-bridge

on:
  push:
    branches:
      - integration
    paths:
      - ".github/workflows/local-main-sync-bridge.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Sync canonical checkout through local gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          gateway = 'http://127.0.0.1:8765'
          key = open('/home/hesham/.config/gova-agent/auth', encoding='utf-8').read().strip()
          headers = {
              'X-Gova-Agent-Key': key,
              'Content-Type': 'application/json',
              'Accept': 'application/json',
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(gateway + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode())

          agent = 'chatgpt-main-sync'
          registered = request('POST', '/v1/agent/register', {'agent_id': agent})
          task = request('POST', '/v1/task/create', {
              'agent_id': agent,
              'goal': 'Safely synchronize /home/hesham/gova with origin/main while preserving local work',
          })
          task_id = task['task_id']
          request('POST', '/v1/lock/acquire', {
              'agent_id': agent,
              'task_id': task_id,
              'kind': 'path',
              'scope': '/home/hesham/gova',
              'lease_seconds': 600,
          })

          command = r'''set -euo pipefail
          cd /home/hesham/gova
          git fetch --prune origin main
          stamp=$(date -u +%Y%m%dT%H%M%SZ)

          if [ -e .git/index.lock ]; then
            if command -v fuser >/dev/null 2>&1 && fuser .git/index.lock >/dev/null 2>&1; then
              echo ACTIVE_INDEX_LOCK
              exit 41
            fi
            if command -v lsof >/dev/null 2>&1 && lsof .git/index.lock >/dev/null 2>&1; then
              echo ACTIVE_INDEX_LOCK
              exit 41
            fi
            rm -f .git/index.lock
            echo REMOVED_STALE_INDEX_LOCK
          fi

          before_head=$(git rev-parse HEAD)
          before_branch=$(git branch --show-current || true)
          before_status=$(git status --porcelain --untracked-files=all)
          echo BEFORE_BRANCH=$before_branch
          echo BEFORE_HEAD=$before_head

          if [ -n "$before_status" ]; then
            echo LOCAL_CHANGES_BEGIN
            printf '%s\n' "$before_status"
            echo LOCAL_CHANGES_END
            git stash push -u -m "chatgpt-main-sync-$stamp"
            echo STASH_CREATED=chatgpt-main-sync-$stamp
          fi

          remote_head=$(git rev-parse origin/main)
          if [ "$before_head" != "$remote_head" ]; then
            git update-ref "refs/backup/chatgpt-main-sync-$stamp" "$before_head"
            echo BACKUP_REF=refs/backup/chatgpt-main-sync-$stamp
          fi

          git checkout -q main
          git reset --hard origin/main

          after_status=$(git status --porcelain --untracked-files=all)
          head=$(git rev-parse HEAD)
          origin_head=$(git rev-parse origin/main)
          tree=$(git rev-parse 'HEAD^{tree}')
          origin_tree=$(git rev-parse 'origin/main^{tree}')

          test -z "$after_status"
          test "$head" = "$origin_head"
          test "$tree" = "$origin_tree"

          echo AFTER_BRANCH=$(git branch --show-current)
          echo AFTER_HEAD=$head
          echo ORIGIN_MAIN=$origin_head
          echo TREE=$tree
          echo ORIGIN_TREE=$origin_tree
          echo WORKTREE_CLEAN=true
          '''

          try:
              started = request('POST', '/v1/exec/start', {
                  'agent_id': agent,
                  'task_id': task_id,
                  'command': command,
                  'cwd': '/home/hesham/gova',
              })
              command_id = started['command_id']
              while True:
                  state = request('GET', f'/v1/commands/{command_id}')['command']
                  if state['status'] != 'running':
                      break
                  time.sleep(1)
              logs = request('GET', f'/v1/commands/{command_id}/logs?tail=50000')
              print(logs.get('stdout', ''), end='')
              if logs.get('stderr'):
                  print(logs['stderr'], end='')
              if state.get('exit_code') != 0:
                  raise SystemExit(state.get('exit_code') or 1)
              request('POST', '/v1/task/complete', {
                  'agent_id': agent,
                  'task_id': task_id,
                  'completed': 'Canonical checkout matches origin/main and is clean',
              })
          finally:
              request('POST', '/v1/lock/release', {
                  'agent_id': agent,
                  'kind': 'path',
                  'scope': '/home/hesham/gova',
              })
          PY
