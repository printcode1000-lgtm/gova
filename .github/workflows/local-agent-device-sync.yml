name: local-agent-device-sync
on:
  push:
    branches: [main]
    paths:
      - 'tools/local-agent/.device-sync-trigger'
permissions:
  contents: read
jobs:
  sync:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Make device, main, and integration trees identical
        shell: bash
        run: |
          set -euo pipefail
          repo=/home/hesham/gova

          git -C "$repo" fetch --quiet origin main integration

          local_changes="$(git -C "$repo" status --porcelain --untracked-files=all)"
          if [ -n "$local_changes" ]; then
            echo 'Refusing to overwrite local changes:' >&2
            printf '%s\n' "$local_changes" >&2
            exit 2
          fi

          parent="$(git -C "$repo" rev-parse origin/main)"
          desired_tree="$(git -C "$repo" rev-parse 'origin/integration^{tree}')"
          echo "parent=$parent"
          echo "desired_tree=$desired_tree"

          commit="$(printf '%s\n' 'chore: synchronize device and GitHub trees' | git -C "$repo" -c user.name='Gova Local Sync' -c user.email='local-sync@gova.invalid' commit-tree "$desired_tree" -p "$parent")"
          echo "sync_commit=$commit"

          git -C "$repo" checkout main >/dev/null 2>&1
          git -C "$repo" reset --hard "$commit"
          git -C "$repo" push origin "$commit:refs/heads/main"
          git -C "$repo" fetch --quiet origin main integration

          local_tree="$(git -C "$repo" rev-parse 'HEAD^{tree}')"
          main_tree="$(git -C "$repo" rev-parse 'origin/main^{tree}')"
          integration_tree="$(git -C "$repo" rev-parse 'origin/integration^{tree}')"

          test "$local_tree" = "$main_tree"
          test "$main_tree" = "$integration_tree"
          test -z "$(git -C "$repo" status --porcelain --untracked-files=all)"
          git -C "$repo" diff --quiet origin/main origin/integration

          echo "main=$(git -C "$repo" rev-parse origin/main)"
          echo "integration=$(git -C "$repo" rev-parse origin/integration)"
          echo "tree=$main_tree"
          echo 'files=identical'
