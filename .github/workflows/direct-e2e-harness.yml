name: direct-e2e-harness

on:
  push:
    branches: [agent-request/chatgpt]
    paths:
      - .github/workflows/direct-e2e-harness.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 3
    steps:
      - name: Release stuck test harness and verify Direct Agent
        shell: bash
        run: |
          set -euo pipefail
          target='LOCAL_AGENT_REQUEST_ID=p2p-e2e-canonical-20260831-230948'
          for envfile in /proc/[0-9]*/environ; do
            [ -r "$envfile" ] || continue
            if tr '\0' '\n' < "$envfile" 2>/dev/null | grep -qx "$target"; then
              pid="${envfile#/proc/}"
              pid="${pid%/environ}"
              cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
              case "$cmdline" in
                *local-agent-main-apply*)
                  echo "terminating-stuck-test-pid=$pid"
                  kill -TERM "$pid" 2>/dev/null || true
                  ;;
              esac
            fi
          done
          sleep 2
          cd /home/hesham/gova
          export GOVA_LOCAL_WORKSPACE=/home/hesham/gova
          export GOVA_DIRECT_AGENT_DIR=/home/hesham/gova/.local/direct-agent
          echo '=== fresh direct end-to-end exec ==='
          result=$(timeout 45 npx tsx scripts/local-agent-direct-remote.ts exec -- "printf 'DIRECT_E2E_OK\n'; hostname; pwd")
          printf '%s\n' "$result"
          printf '%s\n' "$result" | grep -q 'DIRECT_E2E_OK'
          printf '%s\n' "$result" | grep -Eq '"path": "(loopback|lan|webrtc):'
          printf '%s\n' "$result" | grep -q '"exitCode": 0'
          echo 'DIRECT_E2E_VERIFIED'
