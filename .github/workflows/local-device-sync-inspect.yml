name: local-device-sync-inspect
on:
  push:
    branches: [main]
    paths:
      - 'tools/local-agent/.device-sync-inspect-trigger'
permissions:
  contents: read
jobs:
  sync:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Synchronize device and GitHub trees
        shell: bash
        run: |
          set -euo pipefail
          repo=/home/hesham/gova
          integration=/home/hesham/gova-agents/integration

          git -C "$repo" fetch --quiet origin main integration
          test -z "$(git -C "$repo" status --porcelain --untracked-files=all)"
          test -z "$(git -C "$integration" status --porcelain --untracked-files=all)"
          test "$(git -C "$integration" rev-parse HEAD)" = "$(git -C "$repo" rev-parse origin/integration)"

          git -C "$repo" checkout main >/dev/null 2>&1
          git -C "$repo" reset --hard origin/main

          # Make the canonical device tree exactly equal to the verified
          # integration tree while keeping main history intact.
          git -C "$repo" read-tree --reset -u origin/integration

          if ! git -C "$repo" diff --cached --quiet; then
            git -C "$repo" commit -m 'chore: synchronize device and GitHub trees'
          fi

          git -C "$repo" push origin HEAD:main
          git -C "$repo" fetch --quiet origin main integration

          test -z "$(git -C "$repo" status --porcelain --untracked-files=all)"
          test "$(git -C "$repo" rev-parse HEAD^{tree})" = "$(git -C "$repo" rev-parse origin/main^{tree})"
          test "$(git -C "$repo" rev-parse origin/main^{tree})" = "$(git -C "$repo" rev-parse origin/integration^{tree})"
          git -C "$repo" diff --quiet origin/main origin/integration

          echo "main=$(git -C "$repo" rev-parse origin/main)"
          echo "integration=$(git -C "$repo" rev-parse origin/integration)"
          echo "tree=$(git -C "$repo" rev-parse origin/main^{tree})"
          echo 'files=identical'
