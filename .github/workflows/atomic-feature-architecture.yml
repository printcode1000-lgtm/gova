name: Atomic Feature Architecture Refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/atomic-feature-architecture.yml

permissions:
  contents: write

jobs:
  refactor:
    if: contains(github.event.head_commit.message, 'run atomic feature architecture refactor')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Decode atomic codemod
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ''''''
          open('/tmp/refactor.mjs','wb').write(gzip.decompress(base64.b64decode(payload)))
          PY
          node --check /tmp/refactor.mjs
      - name: Apply radical feature refactor
        run: node /tmp/refactor.mjs
      - name: Regenerate architecture docs
        run: npm run architecture:docs
      - name: Architecture verification
        run: npm run architecture:check
      - name: TypeScript verification
        run: npm run typecheck
      - name: Architecture adversarial tests
        run: npm run test:architecture-core
      - name: Composition verification
        run: npm run test:compositions
      - name: Catalog import smoke test
        run: npm run test:catalog-display
      - name: Commit final atomic result
        shell: bash
        run: |
          rm -f .github/workflows/atomic-feature-architecture.yml
          git config user.name 'printcode1000-lgtm'
          git config user.email 'print.code.1000@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(architecture): finalize feature public APIs and generated gates'
          git push origin HEAD:main
