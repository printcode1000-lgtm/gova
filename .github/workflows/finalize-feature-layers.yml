name: finalize-feature-layers

on:
  push:
    branches:
      - main
    paths:
      - scripts/architecture/finalize-feature-layers.mjs
      - .github/workflows/finalize-feature-layers.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Canonicalize all 47 features
        run: node scripts/architecture/finalize-feature-layers.mjs

      - name: Regenerate architecture reference docs
        run: npx tsx -e "import { writeArchitectureDocs } from '@asol/architecture-core'; writeArchitectureDocs();"

      - name: Commit canonicalized tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "refactor(features): canonicalize all feature internals"
            git push origin HEAD:main
          fi

      - name: Architecture invariants
        run: npm run architecture:check

      - name: TypeScript
        run: npm run typecheck

      - name: Architecture attacks
        run: npm run test:architecture-core

      - name: Composition boundaries
        run: npm run test:compositions

      - name: Attest verification
        run: |
          printf '%s\n' "verified $(git rev-parse HEAD)" > .architecture-feature-canonicalization-verified
          git add .architecture-feature-canonicalization-verified
          git commit -m "test(architecture): attest canonical feature verification"
          git push origin HEAD:main
