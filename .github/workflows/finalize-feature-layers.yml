name: finalize-feature-layers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-feature-layers.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Remove one-shot migration artifacts
        run: |
          rm -f scripts/architecture/finalize-feature-layers.mjs
          rm -f scripts/architecture/finalize-feature-contract.mjs
          rm -f scripts/architecture/fix-notification-layering.mjs
          rm -f .architecture-feature-verification-status
          rm -f .architecture-notification-reference-map
          rm -f .architecture-feature-*.log
          rm -f .architecture-feature-canonicalization-verified
          rm -f .github/workflows/finalize-feature-layers.yml

      - name: Synchronize isolated service mirrors
        run: npm run services:sync

      - name: Architecture invariants
        run: npm run architecture:check

      - name: TypeScript
        run: npm run typecheck

      - name: Full repository test suite
        run: npm test

      - name: Commit verified clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Expected cleanup changes are missing."; exit 1; }
          git commit -m "refactor(features): finalize verified canonical architecture"
          git push origin HEAD:main
