name: iOS Native Build & TestFlight Release

on:
  workflow_dispatch:
    inputs:
      destination:
        description: 'Release Destination'
        required: true
        default: 'testflight'
        type: choice
        options:
          - 'testflight'
          - 'build-only'

jobs:
  build-ios:
    name: Build & Deploy iOS
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Dependencies
        run: npm ci

      - name: Generate Branding Assets
        run: npm run branding:generate

      - name: Build Static Web Bundle
        env:
          NEXT_PUBLIC_ASOL_API_BASE_URL: ${{ secrets.ASOL_CAPACITOR_API_BASE_URL || 'https://gova-swart.vercel.app' }}
        run: npm run build:static:local

      - name: Capacitor Sync iOS
        run: npx cap sync ios

      - name: Normalize SPM Paths
        run: npm run ios:spm:normalize

      - name: Validate iOS Push & Identities
        run: npm run ios:push:validate

      - name: Configure iOS Share Extension in Xcode
        run: ruby scripts/configure-ios-share-extension.rb

      - name: Fastlane Doctor
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_BASE64 }}
          ASOL_IOS_TEAM_ID: ${{ secrets.ASOL_IOS_TEAM_ID }}
        run: npm run fastlane -- ios doctor

      - name: Build / Deploy iOS via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_BASE64 }}
          ASOL_IOS_TEAM_ID: ${{ secrets.ASOL_IOS_TEAM_ID }}
          ASOL_IOS_EXPORT_METHOD: 'app-store'
        run: |
          if [ "${{ github.event.inputs.destination }}" = "testflight" ]; then
            npm run fastlane -- ios beta
          else
            npm run fastlane -- ios build
          fi

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASOL-iOS-IPA
          path: ios/build/fastlane/ASOL.ipa
          if-no-files-found: ignore
