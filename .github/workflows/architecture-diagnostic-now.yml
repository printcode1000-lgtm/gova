name: architecture-diagnostic-now

on:
  push:
    branches:
      - main
    paths:
      - '.architecture-diagnostic-trigger'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm 11
        run: npm install -g npm@11

      - name: Align manifest and install
        run: |
          npm pkg set dependencies.tw-animate-css='^1.4.0'
          npm ci

      - name: Run architecture check
        id: architecture
        shell: bash
        run: |
          set +e
          npm run architecture:check > /tmp/architecture.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostic issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.architecture.outputs.code }}
        shell: bash
        run: |
          {
            echo "# Architecture diagnostic"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Exit code: ${EXIT_CODE}"
            echo
            echo '```text'
            tail -n 500 /tmp/architecture.log
            echo '```'
          } > /tmp/architecture-issue.md
          gh issue create --title "architecture diagnostic ${GITHUB_SHA::12}" --body-file /tmp/architecture-issue.md
