name: Finalize Feature Public API

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-feature-public-api.yml

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'run feature public api finalizer')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Remove feature-to-feature seam authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # APPLICATION_FEATURES: public doors are now the only feature-to-feature boundary.
          p = root / 'packages/architecture-core/src/registry/application-features-registry.ts'
          s = p.read_text()
          s = re.sub(
              r"\n  /\*\*\n   \* Justified deep-import seams[\s\S]*?\n  deepImportSeams: readonly string\[\];",
              '', s, count=1,
          )
          s = re.sub(r"^\s{4}deepImportSeams:\s*.*\n", '', s, flags=re.M)
          marker = "    name: 'notifications',"
          start = s.index(marker)
          end = s.index("\n  },", start)
          block = s[start:end]
          block = re.sub(
              r"    permittedDependencies: \[[\s\S]*?\],\n",
              "    permittedDependencies: [],\n",
              block,
              count=1,
          )
          s = s[:start] + block + s[end:]
          p.write_text(s)

          # Dependency graph: only permittedDependencies grants feature-edge authority.
          p = root / 'packages/architecture-core/src/checks/feature-dependency-contract.ts'
          p.write_text(r'''/**
           * Feature dependency graph contract.
           *
           * Builds the real cross-feature import graph from production sources under
           * `src/features/`, then proves:
           * - every edge is declared on `permittedDependencies`
           * - every declared `permittedDependencies` entry is used (no stale edges)
           * - every declared dependency names a registered feature
           *
           * Door legality is enforced separately by `feature-door-contract`.
           */
          import { existsSync, readFileSync, readdirSync, statSync } from 'fs';
          import { dirname, join, relative, resolve } from 'path';

          import { APPLICATION_FEATURES } from '../registry/application-features-registry';
          import { ROOT, addViolation, extractImports, rel } from './architecture-types';

          const FEATURES_ROOT = join(ROOT, 'src', 'features');

          function featureSourceFiles(featureName: string): string[] {
            const root = join(FEATURES_ROOT, featureName);
            if (!existsSync(root)) return [];
            const found: string[] = [];
            const walk = (dir: string): void => {
              for (const entry of readdirSync(dir)) {
                const full = join(dir, entry);
                if (statSync(full).isDirectory()) {
                  if (entry === 'tests' || entry === '__tests__' || entry === 'node_modules') continue;
                  walk(full);
                  continue;
                }
                if (!/\.(ts|tsx)$/.test(entry) || /\.test\.(ts|tsx)$/.test(entry)) continue;
                if (entry.includes('__architecture_attack') || entry.includes('__attack_')) continue;
                found.push(full);
              }
            };
            walk(root);
            return found;
          }

          function featureOfRepoPath(repoPath: string): string | null {
            const normalized = repoPath.replace(/\\/g, '/');
            const match = normalized.match(/^src\/features\/([^/]+)(?:\/|$)/);
            return match?.[1] ?? null;
          }

          function targetFeatureOfSpecifier(specifier: string, importerFile: string): string | null {
            const alias = specifier.match(/^@\/features\/([^/]+)(?:\/|$)/);
            if (alias) return alias[1]!;
            if (!specifier.startsWith('.')) return null;
            const resolved = relative(ROOT, resolve(dirname(importerFile), specifier)).replace(/\\/g, '/');
            return featureOfRepoPath(resolved);
          }

          function buildActualGraph(): Map<string, Map<string, string>> {
            const registered = new Set(APPLICATION_FEATURES.map((f) => f.name));
            const graph = new Map<string, Map<string, string>>();
            for (const feature of APPLICATION_FEATURES) {
              const edges = new Map<string, string>();
              for (const file of featureSourceFiles(feature.name)) {
                const content = readFileSync(file, 'utf8');
                for (const specifier of extractImports(content)) {
                  const target = targetFeatureOfSpecifier(specifier, file);
                  if (!target || target === feature.name || !registered.has(target)) continue;
                  if (!edges.has(target)) edges.set(target, rel(file));
                }
              }
              graph.set(feature.name, edges);
            }
            return graph;
          }

          export function checkFeatureDependencyContract(): void {
            const actual = buildActualGraph();
            const byName = new Map(APPLICATION_FEATURES.map((f) => [f.name, f]));
            for (const feature of APPLICATION_FEATURES) {
              const edges = actual.get(feature.name) ?? new Map();
              const allowed = new Set(feature.permittedDependencies);
              for (const [target, exampleFile] of edges) {
                if (allowed.has(target)) continue;
                addViolation(
                  'Feature Dependencies',
                  join(ROOT, exampleFile),
                  `Feature "${feature.name}" imports "${target}" but permittedDependencies does not declare it.`,
                  `Add "${target}" to permittedDependencies for "${feature.name}" and import only through its declared public door.`,
                );
              }
              for (const dep of feature.permittedDependencies) {
                if (!byName.has(dep)) {
                  addViolation(
                    'Feature Dependencies',
                    join(ROOT, feature.sourcePath),
                    `Feature "${feature.name}" lists unknown permitted dependency "${dep}".`,
                    'Remove the stale name or register the target feature.',
                  );
                  continue;
                }
                if (!edges.has(dep)) {
                  addViolation(
                    'Feature Dependencies',
                    join(ROOT, feature.sourcePath),
                    `Feature "${feature.name}" declares permitted dependency "${dep}" but no production import uses it.`,
                    'Remove the stale permittedDependencies entry.',
                  );
                }
              }
            }
          }
          '''.replace('          ', ''))

          # Door contract: remove feature-to-feature exception registry and all branches that consume it.
          p = root / 'packages/architecture-core/src/checks/feature-door-contract.ts'
          s = p.read_text()
          s = re.sub(
              r"import \{\n  FEATURE_DEEP_IMPORT_SEAMS,\n  isFeatureDeepImportSeam,\n\} from '../registry/feature-deep-import-seams-registry';\n",
              '', s,
          )
          start = s.find('function validateFeatureDeepImportSeamRegistry(): void {')
          if start != -1:
            end = s.index('function isDeclaredDoorPath', start)
            s = s[:start] + s[end:]
          s = s.replace('  validateFeatureDeepImportSeamRegistry();\n', '')
          s = s.replace('  const usedFeatureSeams = new Map<string, Set<string>>();\n', '')
          s = re.sub(
              r"\n        if \(importerFeature && isFeatureDeepImportSeam\(importerFeature, repoTarget\)\) \{[\s\S]*?\n        \}\n",
              '\n', s, count=1,
          )
          s = re.sub(
              r"\n      if \(importerFeature && isFeatureDeepImportSeam\(importerFeature, resolved\)\) \{[\s\S]*?\n      \}\n",
              '\n', s, count=1,
          )
          s = re.sub(
              r"\n  for \(const \[importerFeature, seams\] of Object\.entries\(FEATURE_DEEP_IMPORT_SEAMS\)\) \{[\s\S]*?\n  \}\n(?=\})",
              '\n', s, count=1,
          )
          s = s.replace(
              'If a deep edge is genuinely unavoidable, register only its exact source module in FEATURE_DEEP_IMPORT_SEAMS.',
              'Deep feature-to-feature imports have no exceptions.',
          )
          s = s.replace(
              'Use a declared door for @/features/${targetFeatureResolved}, or register only the exact unavoidable module in FEATURE_DEEP_IMPORT_SEAMS.',
              'Use a declared public door for @/features/${targetFeatureResolved}; deep feature-to-feature imports are forbidden.',
          )
          s = s.replace(
              'Two exact, default-deny seam registries exist for the rare cases where a\n * public barrel would widen an import graph or where an already-established\n * cross-feature internal edge cannot safely be changed as part of an\n * architecture-only refactor:\n * - FEATURE_DEEP_IMPORT_SEAMS for feature-to-feature imports.\n * - COMPOSITION_FEATURE_SEAMS for isolated composition/service-mirror roots.\n *\n * Target-feature declarations alone never grant deep-import authority.\n',
              'Feature-to-feature deep imports have no exceptions. Only composition/service-mirror\n * roots may use exact COMPOSITION_FEATURE_SEAMS when a broad public barrel would\n * widen an isolated deployment graph.\n',
          )
          p.write_text(s)

          # Package public exports: remove obsolete feature seam registry exports.
          p = root / 'packages/architecture-core/src/index.ts'
          s = p.read_text()
          s = re.sub(
              r"export \{\n  FEATURE_DEEP_IMPORT_SEAMS,\n  isFeatureDeepImportSeam,\n  type FeatureDeepImportSeamOwner,\n\} from './registry/feature-deep-import-seams-registry';\n",
              '', s,
          )
          p.write_text(s)

          # Main architecture catalog no longer documents feature deep seams.
          p = root / 'packages/architecture-core/src/docs/generate-architecture-docs.ts'
          s = p.read_text()
          s = re.sub(
              r"\n    lines\.push\(\n      `\| \*\*Deep Import Seams\*\* \|[\s\S]*?\n    \);",
              '', s, count=1,
          )
          p.write_text(s)

          # The remaining seam document is explicitly composition-only.
          p = root / 'packages/architecture-core/src/docs/generate-feature-seams-doc.ts'
          p.write_text(r'''/** Deterministic reference documentation for exact composition/service-mirror seams. */
          import { existsSync, readFileSync, writeFileSync } from 'fs';
          import { join } from 'path';

          import { COMPOSITION_FEATURE_SEAMS } from '../registry/composition-feature-seams-registry';

          const ROOT = process.cwd();
          export const GENERATED_FEATURE_SEAMS_DOC =
            'docs/01-architecture/08-reference/feature-seams.md' as const;

          function tableEscape(value: string): string {
            return value.replace(/\|/g, '\\|');
          }

          export function renderFeatureSeamsDoc(): string {
            const rows = Object.entries(COMPOSITION_FEATURE_SEAMS)
              .flatMap(([owner, seams]) => seams.map((path) => `| \`${tableEscape(owner)}\` | \`${tableEscape(path)}\` |`));
            return [
              '<!-- GENERATED FILE — DO NOT EDIT. Run `npm run architecture:docs`. -->',
              '',
              '# Composition Feature Seams',
              '',
              'Feature-to-feature dependencies have no deep-import exceptions: they must use declared public doors.',
              'The only exact application paths listed here belong to composition/service-mirror packages whose isolated import graphs must remain narrower than a broad feature barrel.',
              '',
              'Canonical source:',
              '- `packages/architecture-core/src/registry/composition-feature-seams-registry.ts`',
              '',
              `Current inventory: **${rows.length}** exact composition seam path(s).`,
              '',
              '| Composition package | Exact application module |',
              '| --- | --- |',
              ...(rows.length > 0 ? rows : ['| — | — |']),
              '',
              '## Enforcement',
              '',
              '- Feature-to-feature deep imports always fail.',
              '- Relative traversal cannot bypass feature public doors or composition seams.',
              '- Composition seams must be exact, existing, registered, and actively used.',
              '- Stale, duplicate, missing, or broad composition seam authority fails `architecture:check`.',
              '',
            ].join('\n');
          }

          export function writeFeatureSeamsDoc(): void {
            writeFileSync(join(ROOT, GENERATED_FEATURE_SEAMS_DOC), renderFeatureSeamsDoc(), 'utf8');
          }

          export function diffFeatureSeamsDoc(): { path: string; reason: string }[] {
            const absolute = join(ROOT, GENERATED_FEATURE_SEAMS_DOC);
            if (!existsSync(absolute)) {
              return [{ path: GENERATED_FEATURE_SEAMS_DOC, reason: 'generated reference is missing' }];
            }
            return readFileSync(absolute, 'utf8') === renderFeatureSeamsDoc()
              ? []
              : [{ path: GENERATED_FEATURE_SEAMS_DOC, reason: 'generated reference is stale' }];
          }
          '''.replace('          ', ''))

          obsolete = root / 'packages/architecture-core/src/registry/feature-deep-import-seams-registry.ts'
          if obsolete.exists(): obsolete.unlink()

          # Fail the transformation itself if code still carries feature-to-feature seam authority.
          forbidden = []
          for base in [root / 'packages/architecture-core/src']:
            for file in base.rglob('*.ts'):
              text = file.read_text()
              if 'FEATURE_DEEP_IMPORT_SEAMS' in text or 'deepImportSeams' in text:
                forbidden.append(str(file))
          if forbidden:
            raise SystemExit('stale feature seam authority remains: ' + ', '.join(forbidden))
          PY
      - run: npm run architecture:docs
      - run: npm run architecture:check
      - run: npm run test:architecture-core
      - run: npm run test:notifications
      - run: npm run test:release-commands
      - run: npm run test:compositions
      - run: npm run typecheck
      - name: Commit verified final Public API stage
        shell: bash
        run: |
          rm -f .github/workflows/finalize-feature-public-api.yml
          git config user.name "printcode1000-lgtm"
          git config user.email "print.code.1000@gmail.com"
          git add -A
          git commit -m "refactor(architecture): enforce feature public APIs without seams"
          git push origin main
