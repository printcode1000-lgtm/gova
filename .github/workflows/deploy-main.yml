# Dispatches main pushes to the production deployment sandbox. The local runner
# is preferred; GitHub-hosted execution is used only after runner availability is
# checked. No repository deployment secrets are exposed: GitHub OIDC
# authenticates this exact workflow to the main application's narrow machine
# endpoint.
name: deploy-main

on:
  push:
    branches:
      - main
    # Agent control-plane changes are operational, not shippable: they alter how
    # agents coordinate on this machine, never what production serves. Excluding
    # them keeps a coordination commit from consuming a deployment slot.
    paths-ignore:
      - ".agent-control/**"
      - ".github/workflows/local-agent-*.yml"
      - "scripts/local-agent/**"
      - "scripts/local-agent-*.ts"
      - "docs/07-mobile-and-release/local-agent-runner-pool.md"

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: asol-production-main
  cancel-in-progress: false

jobs:
  select-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Prefer local runner when available
        id: select
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GOVA_RUNNER_STATUS_TOKEN }}
          script: |
            const requiredLabels = ['self-hosted', 'Linux', 'X64', 'gova'];
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            let available = false;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              const response = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              available = response.data.runners.some((runner) => {
                const labels = new Set((runner.labels || []).map((label) => label.name));
                return runner.status === 'online' && !runner.busy && requiredLabels.every((label) => labels.has(label));
              });
              if (available) break;
              core.info(`Local gova runner is unavailable after check ${attempt}/12.`);
              if (attempt < 12) await sleep(30_000);
            }
            const selected = available ? 'local' : 'github-hosted';
            core.info(`Selected ${selected} execution path.`);
            core.setOutput('runner', selected);

  deploy-local:
    needs: select-runner
    if: needs.select-runner.outputs.runner == 'local'
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 110
    steps:
      - name: Deploy pushed revision to Vercel production accounts
        uses: actions/github-script@v7
        with:
          script: |
            const endpoint = 'https://gova-swart.vercel.app/api/super-admin/production-deploy/github';
            const audience = 'asol-production-deploy';
            const pushedRevision = '${{ github.sha }}';
            core.info(`Dispatching authenticated main revision ${pushedRevision}.`);
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const request = async (method, requestId = '') => {
              const token = await core.getIDToken(audience);
              const url = requestId ? `${endpoint}?requestId=${encodeURIComponent(requestId)}` : endpoint;
              return fetch(url, {
                method,
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
              });
            };

            let started;
            const startDeadline = Date.now() + 55 * 60 * 1000;
            while (Date.now() < startDeadline) {
              const response = await request('POST');
              if (response.status === 202) {
                started = await response.json();
                break;
              }
              if ([404, 409, 502, 503, 504].includes(response.status)) {
                core.info(`Deploy endpoint returned ${response.status}; retrying.`);
                await sleep(20_000);
                continue;
              }
              throw new Error(`Deploy start rejected (${response.status}): ${await response.text()}`);
            }
            const requestId = started?.snapshot?.requestId;
            if (!requestId) throw new Error('Deploy did not start before the retry deadline.');

            for (;;) {
              await sleep(20_000);
              const response = await request('GET', requestId);
              if (!response.ok) throw new Error(`Deploy status failed (${response.status}): ${await response.text()}`);
              const result = await response.json();
              const status = result?.snapshot?.status;
              const stage = result?.snapshot?.stage;
              core.info(`Production deploy ${requestId}: ${status} / ${stage}`);
              if (status === 'succeeded') break;
              if (status === 'failed') throw new Error(result?.snapshot?.error || 'Production deploy failed.');
            }

  deploy-github-hosted:
    needs: select-runner
    if: needs.select-runner.outputs.runner == 'github-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Deploy pushed revision to Vercel production accounts
        uses: actions/github-script@v7
        with:
          script: |
            const endpoint = 'https://gova-swart.vercel.app/api/super-admin/production-deploy/github';
            const audience = 'asol-production-deploy';
            const pushedRevision = '${{ github.sha }}';
            core.info(`Dispatching authenticated main revision ${pushedRevision}.`);
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const request = async (method, requestId = '') => {
              const token = await core.getIDToken(audience);
              const url = requestId ? `${endpoint}?requestId=${encodeURIComponent(requestId)}` : endpoint;
              return fetch(url, {
                method,
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
              });
            };

            let started;
            const startDeadline = Date.now() + 55 * 60 * 1000;
            while (Date.now() < startDeadline) {
              const response = await request('POST');
              if (response.status === 202) {
                started = await response.json();
                break;
              }
              if ([404, 409, 502, 503, 504].includes(response.status)) {
                core.info(`Deploy endpoint returned ${response.status}; retrying.`);
                await sleep(20_000);
                continue;
              }
              throw new Error(`Deploy start rejected (${response.status}): ${await response.text()}`);
            }
            const requestId = started?.snapshot?.requestId;
            if (!requestId) throw new Error('Deploy did not start before the retry deadline.');

            for (;;) {
              await sleep(20_000);
              const response = await request('GET', requestId);
              if (!response.ok) throw new Error(`Deploy status failed (${response.status}): ${await response.text()}`);
              const result = await response.json();
              const status = result?.snapshot?.status;
              const stage = result?.snapshot?.stage;
              core.info(`Production deploy ${requestId}: ${status} / ${stage}`);
              if (status === 'succeeded') break;
              if (status === 'failed') throw new Error(result?.snapshot?.error || 'Production deploy failed.');
            }
