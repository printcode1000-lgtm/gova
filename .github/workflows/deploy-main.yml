# Dispatches main pushes to the production deployment sandbox. The local runner
# is preferred; GitHub-hosted execution is used only after runner availability is
# checked. No repository deployment secrets are exposed: GitHub OIDC
# authenticates this exact workflow to the stable control-plane machine endpoint.
name: deploy-main

on:
  push:
    branches:
      - main
    # A push only deploys when it can change what production serves.
    #
    # Control-plane changes are operational: they alter how agents coordinate on
    # this machine. Documentation and agent instructions are not shipped at all.
    # Neither can affect the running application, so neither should consume a
    # deployment slot — and during an active session they are most of the pushes,
    # each one previously starting a release that then fought the previous one
    # for the single-deploy lock.
    paths-ignore:
      - "tools/local-agent/**"
      - ".github/workflows/local-agent-*.yml"
      - "docs/**"
      - "note/**"
      - ".agents/**"
      - ".vscode/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "README.md"

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: asol-production-main
  cancel-in-progress: false

env:
  ASOL_CONTROL_DEPLOY_ENDPOINT: https://asol-control.vercel.app/api/super-admin/production-deploy/github

jobs:
  select-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Prefer local runner when available
        id: select
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GOVA_RUNNER_STATUS_TOKEN }}
          script: |
            const requiredLabels = ['self-hosted', 'Linux', 'X64', 'gova'];
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            let available = false;
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              const response = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              available = response.data.runners.some((runner) => {
                const labels = new Set((runner.labels || []).map((label) => label.name));
                return runner.status === 'online' && !runner.busy && requiredLabels.every((label) => labels.has(label));
              });
              if (available) break;
              core.info(`Local gova runner is unavailable after check ${attempt}/12.`);
              if (attempt < 12) await sleep(30_000);
            }
            const selected = available ? 'local' : 'github-hosted';
            core.info(`Selected ${selected} execution path.`);
            core.setOutput('runner', selected);

  deploy-local:
    needs: select-runner
    if: needs.select-runner.outputs.runner == 'local'
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 110
    steps:
      - name: Deploy pushed revision to Vercel production accounts
        uses: actions/github-script@v7
        with:
          script: |
            const endpoint = process.env.ASOL_CONTROL_DEPLOY_ENDPOINT;
            if (!endpoint) throw new Error('ASOL_CONTROL_DEPLOY_ENDPOINT is required.');
            const audience = 'asol-production-deploy';
            const pushedRevision = '${{ github.sha }}';
            core.info(`Dispatching authenticated main revision ${pushedRevision} through ASOL Control.`);
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            // The OIDC token is minted per request, and a release polls for the
            // best part of an hour. A transient token failure is not a deployment
            // failure, so it is retried; only a persistent one is fatal.
            const idToken = async () => {
              let lastError;
              for (let attempt = 1; attempt <= 4; attempt += 1) {
                try {
                  return await core.getIDToken(audience);
                } catch (error) {
                  lastError = error;
                  core.info(`OIDC token attempt ${attempt} failed: ${error.message}`);
                  if (attempt < 4) await sleep(attempt * 5_000);
                }
              }
              throw lastError;
            };
            const request = async (method, requestId = '') => {
              const token = await idToken();
              const url = requestId ? `${endpoint}?requestId=${encodeURIComponent(requestId)}` : endpoint;
              return fetch(url, {
                method,
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
              });
            };

            let started;
            const startDeadline = Date.now() + 55 * 60 * 1000;
            while (Date.now() < startDeadline) {
              const response = await request('POST');
              if (response.status === 202) {
                started = await response.json();
                break;
              }
              if ([404, 502, 503, 504].includes(response.status)) {
                core.info(`Deploy endpoint returned ${response.status}; retrying.`);
                await sleep(20_000);
                continue;
              }
              // A 409 is only worth waiting on when it is the concurrency lock
              // saying a release is already in flight. Any other conflict is a
              // real rejection and fails immediately.
              if (response.status === 409) {
                const body = await response.text();
                let code;
                try {
                  code = JSON.parse(body)?.error;
                } catch {
                  code = undefined;
                }
                if (code === 'productionDeployAlreadyRunning') {
                  core.info('A production deployment is already running; waiting for it.');
                  await sleep(20_000);
                  continue;
                }
                throw new Error(`Deploy start rejected (409): ${body}`);
              }
              throw new Error(`Deploy start rejected (${response.status}): ${await response.text()}`);
            }
            const requestId = started?.snapshot?.requestId;
            if (!requestId) throw new Error('Deploy did not start before the retry deadline.');

            for (;;) {
              await sleep(20_000);
              const response = await request('GET', requestId);
              if (!response.ok) throw new Error(`Deploy status failed (${response.status}): ${await response.text()}`);
              const result = await response.json();
              const status = result?.snapshot?.status;
              const stage = result?.snapshot?.stage;
              core.info(`Production deploy ${requestId}: ${status} / ${stage}`);
              if (status === 'succeeded') break;
              if (status === 'failed') throw new Error(result?.snapshot?.error || 'Production deploy failed.');
            }

  deploy-github-hosted:
    needs: select-runner
    if: needs.select-runner.outputs.runner == 'github-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Deploy pushed revision to Vercel production accounts
        uses: actions/github-script@v7
        with:
          script: |
            const endpoint = process.env.ASOL_CONTROL_DEPLOY_ENDPOINT;
            if (!endpoint) throw new Error('ASOL_CONTROL_DEPLOY_ENDPOINT is required.');
            const audience = 'asol-production-deploy';
            const pushedRevision = '${{ github.sha }}';
            core.info(`Dispatching authenticated main revision ${pushedRevision} through ASOL Control.`);
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            // Same OIDC retry contract as the self-hosted path.
            const idToken = async () => {
              let lastError;
              for (let attempt = 1; attempt <= 4; attempt += 1) {
                try {
                  return await core.getIDToken(audience);
                } catch (error) {
                  lastError = error;
                  core.info(`OIDC token attempt ${attempt} failed: ${error.message}`);
                  if (attempt < 4) await sleep(attempt * 5_000);
                }
              }
              throw lastError;
            };
            const request = async (method, requestId = '') => {
              const token = await idToken();
              const url = requestId ? `${endpoint}?requestId=${encodeURIComponent(requestId)}` : endpoint;
              return fetch(url, {
                method,
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
              });
            };

            let started;
            const startDeadline = Date.now() + 55 * 60 * 1000;
            while (Date.now() < startDeadline) {
              const response = await request('POST');
              if (response.status === 202) {
                started = await response.json();
                break;
              }
              if ([404, 502, 503, 504].includes(response.status)) {
                core.info(`Deploy endpoint returned ${response.status}; retrying.`);
                await sleep(20_000);
                continue;
              }
              if (response.status === 409) {
                const body = await response.text();
                let code;
                try {
                  code = JSON.parse(body)?.error;
                } catch {
                  code = undefined;
                }
                if (code === 'productionDeployAlreadyRunning') {
                  core.info('A production deployment is already running; waiting for it.');
                  await sleep(20_000);
                  continue;
                }
                throw new Error(`Deploy start rejected (409): ${body}`);
              }
              throw new Error(`Deploy start rejected (${response.status}): ${await response.text()}`);
            }
            const requestId = started?.snapshot?.requestId;
            if (!requestId) throw new Error('Deploy did not start before the retry deadline.');

            for (;;) {
              await sleep(20_000);
              const response = await request('GET', requestId);
              if (!response.ok) throw new Error(`Deploy status failed (${response.status}): ${await response.text()}`);
              const result = await response.json();
              const status = result?.snapshot?.status;
              const stage = result?.snapshot?.stage;
              core.info(`Production deploy ${requestId}: ${status} / ${stage}`);
              if (status === 'succeeded') break;
              if (status === 'failed') throw new Error(result?.snapshot?.error || 'Production deploy failed.');
            }
