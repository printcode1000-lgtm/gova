name: test-diagnostic-now

on:
  push:
    branches:
      - main
    paths:
      - '.test-diagnostic-trigger'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup npm 11
        run: npm install -g npm@11
      - name: Align manifest and install
        run: |
          npm pkg set dependencies.tw-animate-css='^1.4.0'
          npm ci
      - name: Synchronize mirrors
        run: npm run services:sync
      - name: Run generated test scripts after native validation
        id: tests
        shell: bash
        run: |
          set +e
          node <<'NODE' > /tmp/test.log 2>&1
          const { spawnSync } = require('node:child_process');
          const pkg = require('./package.json');
          const excluded = new Set([
            'test:notifications-composition',
            'test:products-composition',
            'test:orders-composition',
            'test:profiles-composition',
            'test:submain-composition',
            'test:sub2main-composition',
          ]);
          const names = Object.keys(pkg.scripts || {})
            .filter((name) => name.startsWith('test:'))
            .filter((name) => !excluded.has(name))
            .sort((a, b) => a.localeCompare(b));
          console.log(`Running ${names.length} generated test script(s) after the iOS validation step.`);
          for (let i = 0; i < names.length; i += 1) {
            const name = names[i];
            console.log(`\n[diagnostic] ${i + 1}/${names.length}: npm run ${name}`);
            const result = spawnSync('npm', ['run', name], {
              stdio: 'inherit',
              env: process.env,
              shell: false,
            });
            if (result.status !== 0) {
              console.error(`\n[diagnostic] FAILED: ${name} (exit ${result.status})`);
              process.exit(result.status || 1);
            }
          }
          console.log('\n[diagnostic] All generated test scripts passed after the iOS validation step.');
          NODE
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.tests.outputs.code }}
        shell: bash
        run: |
          {
            echo '# Test diagnostic after iOS validation'
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Exit code: ${EXIT_CODE}"
            echo
            echo '```text'
            tail -n 1000 /tmp/test.log
            echo '```'
          } > /tmp/test-issue.md
          gh issue create --title "test diagnostic ${GITHUB_SHA::12}" --body-file /tmp/test-issue.md
