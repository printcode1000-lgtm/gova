name: test-diagnostic-now

on:
  push:
    branches:
      - main
    paths:
      - '.test-diagnostic-trigger'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup npm 11
        run: npm install -g npm@11
      - name: Align manifest and install
        run: |
          npm pkg set dependencies.tw-animate-css='^1.4.0'
          npm ci
      - name: Run test gate
        id: tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.tests.outputs.code }}
        shell: bash
        run: |
          {
            echo '# Test diagnostic'
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Exit code: ${EXIT_CODE}"
            echo
            echo '```text'
            tail -n 800 /tmp/test.log
            echo '```'
          } > /tmp/test-issue.md
          gh issue create --title "test diagnostic ${GITHUB_SHA::12}" --body-file /tmp/test-issue.md
