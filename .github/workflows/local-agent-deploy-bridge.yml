name: local-agent-deploy-bridge
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-bridge.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 180
    steps:
      - name: Repair stale release count and resume deploy all through persistent gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          base='http://127.0.0.1:8765'
          key=Path('/home/hesham/.config/gova-agent/auth').read_text().strip()
          headers={'X-Gova-Agent-Key':key,'Content-Type':'application/json'}
          def req(method,path,body=None,timeout=60):
              r=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),method=method,headers=headers)
              with urllib.request.urlopen(r,timeout=timeout) as x:
                  return json.loads(x.read() or b'{}')
          with urllib.request.urlopen(base+'/health',timeout=5) as r:
              if r.status != 200: raise SystemExit('gateway health failed')
          agent='cloud-deploy-all-resume3-20260903'
          req('POST','/v1/agent/register',{'agent_id':agent})
          command=r'''set -o pipefail
          repo=/home/hesham/gova
          iw=/home/hesham/gova-agents/integration
          test_file='src/features/release-commands/tests/release-commands.test.ts'
          old='assert.equal(androidBranchIds.length, 356, "android release runbook must expose 356 selectable branches");'
          new='assert.equal(androidBranchIds.length, 359, "android release runbook must expose 359 selectable branches");'

          git -C "$repo" fetch --quiet origin main integration
          if [ "$(git -C "$repo" branch --show-current)" != main ]; then
            echo 'canonical repo is not on main' >&2
            exit 2
          fi
          if [ "$(git -C "$repo" rev-parse HEAD)" != "$(git -C "$repo" rev-parse origin/main)" ]; then
            echo 'canonical main is not aligned with origin/main' >&2
            exit 2
          fi
          if [ -n "$(git -C "$repo" status --porcelain -- "$test_file")" ]; then
            echo 'main release-command test has local modifications' >&2
            exit 2
          fi

          if [ ! -e "$iw/.git" ]; then
            echo 'shared integration worktree missing' >&2
            exit 2
          fi
          if [ -n "$(git -C "$iw" status --porcelain)" ]; then
            echo 'integration worktree is not clean' >&2
            exit 2
          fi
          git -C "$iw" fetch --quiet origin integration
          git -C "$iw" checkout integration >/dev/null
          git -C "$iw" reset --hard origin/integration >/dev/null

          python3 - "$iw/$test_file" "$old" "$new" <<'INNER'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); old=sys.argv[2]; new=sys.argv[3]
          s=p.read_text()
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale count assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          INNER
          (cd "$iw" && npx tsx "$test_file")
          git -C "$iw" add -- "$test_file"
          git -C "$iw" commit -m 'test(release): update Android runbook branch count' >/dev/null
          git -C "$iw" push origin HEAD:integration

          git -C "$repo" fetch --quiet origin main
          if [ "$(git -C "$repo" rev-parse HEAD)" != "$(git -C "$repo" rev-parse origin/main)" ]; then
            echo 'origin/main changed during repair' >&2
            exit 2
          fi
          python3 - "$repo/$test_file" "$old" "$new" <<'INNER'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); old=sys.argv[2]; new=sys.argv[3]
          s=p.read_text()
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale count assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          INNER
          (cd "$repo" && npx tsx "$test_file")
          git -C "$repo" add -- "$test_file"
          git -C "$repo" commit -m 'test(release): update Android runbook branch count' >/dev/null
          git -C "$repo" push origin HEAD:main

          cd "$repo"
          npm run deploy:all -- --from-branch=tests 2>&1 | tee /tmp/gova-deploy-all.log
          rc=${PIPESTATUS[0]}
          echo "DEPLOY_EXIT_CODE=$rc"
          exit "$rc"
          '''
          started=req('POST','/v1/exec/start',{'agent_id':agent,'command':command,'cwd':'/home/hesham/gova'})
          cid=started['command_id']
          print('COMMAND_ID='+cid,flush=True)
          last=''
          for _ in range(10800):
              st=req('GET','/v1/commands/'+cid)['command']
              logs=req('GET','/v1/commands/'+cid+'/logs?tail=16000',timeout=30)
              out=logs.get('stdout','')
              if out != last:
                  print(out[-16000:],flush=True)
                  last=out
              if st['status']!='running':
                  logs=req('GET','/v1/commands/'+cid+'/logs?tail=800000',timeout=120)
                  print(logs.get('stdout',''))
                  if logs.get('stderr'): print(logs.get('stderr',''))
                  print('GATEWAY_EXIT_CODE='+str(st.get('exit_code')))
                  raise SystemExit(0 if st.get('exit_code')==0 else 1)
              time.sleep(5)
          raise SystemExit('timeout waiting for gateway deploy')
          PY
