name: local-agent-status

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Comma or newline separated local workspace paths to inspect."
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  local-status:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 15
    env:
      GOVA_LOCAL_WORKSPACE: /home/hesham/gova
      GOVA_RUNNER_STATUS_TOKEN: ${{ secrets.GOVA_RUNNER_STATUS_TOKEN }}
      LOCAL_AGENT_STATUS_PATHS: ${{ inputs.paths }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Read local and GitHub state
        run: npx tsx scripts/local-agent-status.ts
