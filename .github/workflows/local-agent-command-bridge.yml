name: local-agent-command-bridge

on:
  push:
    branches: [integration]
    paths:
      - '.github/workflows/local-agent-command-bridge.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 5
    steps:
      - name: Probe local Gova workspace
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "timestamp=$(date --iso-8601=seconds)"
            echo "hostname=$(hostname)"
            echo "user=$(whoami)"
            cd /home/hesham/gova
            echo "pwd=$PWD"
            echo "repo_root=$(git rev-parse --show-toplevel)"
            echo "branch=$(git branch --show-current)"
            echo "head=$(git rev-parse HEAD)"
            echo "=== git status ==="
            git status --short --branch
            echo "=== gateway ==="
            systemctl --user is-active gova-agent-gateway.service || true
            curl -fsS http://127.0.0.1:8765/health || true
            echo
          } | tee /tmp/gova-runner-probe.txt

      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: gova-runner-probe
          path: /tmp/gova-runner-probe.txt
          retention-days: 1
