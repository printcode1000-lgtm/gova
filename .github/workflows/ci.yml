name: Architecture & Quality CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The native-surface report compares against the newest `native-v*`
          # tag. The default shallow clone fetches no tags, so the check would
          # stay silent in CI and the signal would exist only on a laptop.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Architecture check
        run: npm run architecture:check

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
