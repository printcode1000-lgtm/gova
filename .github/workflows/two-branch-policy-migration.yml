name: two-branch-policy-migration

on:
  push:
    branches:
      - "agent-request/chatgpt"
    paths:
      - ".github/workflows/two-branch-policy-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-request/chatgpt
          fetch-depth: 0
      - name: Apply fixed two-branch migration
        run: python3 .github/two_branch_policy_migration.py
