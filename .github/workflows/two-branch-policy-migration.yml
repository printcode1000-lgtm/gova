name: two-branch-policy-migration

on:
  push:
    branches:
      - "agent-request/chatgpt"
    paths:
      - ".github/workflows/two-branch-policy-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 15
    steps:
      - name: Apply migration in isolated local worktree
        working-directory: /home/hesham/gova
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent-request/chatgpt
          WT=/home/hesham/gova/.local/two-branch-policy-migration
          git worktree remove --force "$WT" 2>/dev/null || true
          rm -rf "$WT"
          git worktree add --detach "$WT" origin/agent-request/chatgpt
          cd "$WT"
          sed -i '260,268d' .github/two_branch_policy_migration.py
          python3 .github/two_branch_policy_migration.py
          cd /home/hesham/gova
          git worktree remove --force "$WT" 2>/dev/null || true
