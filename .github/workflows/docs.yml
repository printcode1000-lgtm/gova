# Docs-focused GitHub Actions workflow.
#
# This is the only allowed workflow. It is path-filtered to documentation,
# agent instruction surfaces, and docs/knowledge/runtime tooling. Ordinary
# code-only pushes do not run this job. Local `npm run github:ci-policy`
# enforces the contract; that guard is not itself a general GitHub app CI job.
name: docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".agents/**"
      - "scripts/docs/**"
      - "scripts/architecture/**"
      - "scripts/architecture-check.ts"
      - "scripts/runtime/**"
      - "scripts/github-ci-policy.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".agents/**"
      - "scripts/docs/**"
      - "scripts/architecture/**"
      - "scripts/architecture-check.ts"
      - "scripts/runtime/**"
      - "scripts/github-ci-policy.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCS_CI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate documentation knowledge
        run: npm run docs:generate

      - name: Documentation CI
        run: npm run docs:ci

      - name: Generated documentation must match HEAD
        run: npm run docs:diff -- --against-head

      - name: Runtime compatibility contracts
        run: npm run runtime:check
