name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Probe running deploy from local runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db=Path('/home/hesham/.local/share/gova-agent-runtime/runtime.sqlite3')
          con=sqlite3.connect(db); con.row_factory=sqlite3.Row
          row=con.execute("select * from commands where agent_id=? order by started_at desc limit 1",('cloud-deploy-all-resume3-20260903',)).fetchone()
          if not row:
              print('NO_COMMAND')
              raise SystemExit(0)
          print(dict(row))
          for key in ('out_path','err_path'):
              p=Path(row[key])
              if p.exists():
                  print('=== '+key+' ===')
                  print(p.read_bytes()[-180000:].decode(errors='replace'))
          PY
