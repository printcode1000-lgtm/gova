name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Inspect original presentation sizes
        shell: bash
        run: |
          set -euo pipefail
          cd /home/hesham/gova
          for f in \
            src/features/google-play-console/presentation/DeployRunbookExecutionBox.tsx \
            src/features/google-play-console/presentation/DeployRunbookControls.tsx \
            src/features/google-play-console/presentation/tabs/PlayTracksTab.tsx; do
            printf '%s ' "$f"
            git show HEAD:"$f" | wc -l
          done
          echo '=== ORIGINAL LONG COUNTS ==='
          for f in \
            src/features/google-play-console/presentation/DeployRunbookExecutionBox.tsx \
            src/features/google-play-console/presentation/DeployRunbookControls.tsx \
            src/features/google-play-console/presentation/tabs/PlayTracksTab.tsx; do
            git show HEAD:"$f" | awk -v f="$f" 'length($0)>120 {n++} END{print f,n+0}'
          done
