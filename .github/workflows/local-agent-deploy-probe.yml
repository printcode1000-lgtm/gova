name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 30
    steps:
      - name: Submit reconciled state through Gateway
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          base='http://127.0.0.1:8765'
          key=Path('/home/hesham/.config/gova-agent/auth').read_text().strip()
          headers={'X-Gova-Agent-Key':key,'Content-Type':'application/json'}
          def call(method,path,payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=body,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=180) as r: return json.loads(r.read() or b'{}')
          agent='chatgpt-main-reconcile'
          call('POST','/v1/agent/register',{'agent_id':agent})
          task=call('POST','/v1/task/create',{'agent_id':agent,'goal':'Apply the verified main-to-integration reconciliation result through the official integration gate.'})['task_id']
          ws=call('POST','/v1/workspace/create',{'agent_id':agent,'task_id':task})['worktree']
          command=r'''set -euo pipefail
          git diff --binary 1aaeb92f^1 1aaeb92f | git apply --index
          npm run docs:check
          npx tsx scripts/tests/service-release-environment.test.ts
          git diff --check
          git diff --cached --check
          git commit -m 'chore: reconcile latest main state into integration'
          echo TASK_COMMIT=$(git rev-parse HEAD)
          '''
          started=call('POST','/v1/exec/start',{'agent_id':agent,'task_id':task,'command':command,'cwd':ws})
          cid=started['command_id']
          while True:
              cmd=call('GET','/v1/commands/'+cid)['command']
              if cmd['status']!='running': break
              time.sleep(1)
          logs=call('GET','/v1/commands/'+cid+'/logs?tail=250000')
          print(logs.get('stdout','')); print(logs.get('stderr',''))
          if cmd.get('exit_code') != 0: raise SystemExit(1)
          out=logs.get('stdout','')
          sha=[line.split('=',1)[1].strip() for line in out.splitlines() if line.startswith('TASK_COMMIT=')][-1]
          result=call('POST','/v1/integration/submit',{'agent_id':agent,'task_id':task,'commit_sha':sha,'verification':['git diff --check HEAD^ HEAD']})
          print('INTEGRATION_SUBMIT='+json.dumps(result,ensure_ascii=False))
          PY
