name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Inspect recent Gateway commands
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          base='http://127.0.0.1:8765'
          key=Path('/home/hesham/.config/gova-agent/auth').read_text().strip()
          req=urllib.request.Request(base+'/v1/commands',headers={'X-Gova-Agent-Key':key})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.loads(r.read())
          print(json.dumps(data,ensure_ascii=False))
          PY
