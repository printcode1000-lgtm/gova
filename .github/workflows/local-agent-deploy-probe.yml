name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Create isolated Gateway task workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path

          base='http://127.0.0.1:8765'
          key=Path('/home/hesham/.config/gova-agent/auth').read_text().strip()
          headers={'X-Gova-Agent-Key':key,'Content-Type':'application/json'}

          def req(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as resp:
                  body=resp.read().decode()
              return json.loads(body) if body else {}

          agent='chatgpt-service-smoke-fix'
          print('REGISTER', req('POST','/v1/agent/register',{'agent_id':agent}))
          task=req('POST','/v1/task/create',{'agent_id':agent,'goal':'Fix the service smoke release-environment gate from the nearest safe checkpoint and verify services build/smoke.'})
          print('TASK', task)
          task_id=task.get('task_id') or task.get('id') or (task.get('task') or {}).get('task_id') or (task.get('task') or {}).get('id')
          if not task_id:
              raise SystemExit('task id not found')
          workspace=req('POST','/v1/workspace/create',{'agent_id':agent,'task_id':task_id})
          print('WORKSPACE', workspace)
          PY
