name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 30
    steps:
      - name: Format and validate integration worktree
        shell: bash
        run: |
          set -euo pipefail
          iw=/home/hesham/gova-agents/integration
          git -C "$iw" fetch --quiet origin integration
          if [ -n "$(git -C "$iw" status --porcelain)" ]; then
            echo "integration worktree is dirty" >&2
            git -C "$iw" status --short
            exit 2
          fi
          git -C "$iw" checkout integration >/dev/null
          git -C "$iw" reset --hard origin/integration >/dev/null
          cd "$iw"
          /home/hesham/gova/node_modules/.bin/prettier --write "src/features/google-play-console/presentation/**/*.tsx" --print-width 120
          npm run test:release-commands
          echo '=== DIFF STAT ==='
          git diff --stat
          echo '=== STATUS ==='
          git status --short
