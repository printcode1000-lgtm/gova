name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Inspect local formatter availability
        shell: bash
        run: |
          set -euo pipefail
          cd /home/hesham/gova
          git fetch --quiet origin main
          git restore -- public/sync_data/*schema-sync-report.json 2>/dev/null || true
          git pull --ff-only origin main
          node - <<'NODE'
          for (const pkg of ['prettier','@biomejs/biome','typescript']) {
            try { console.log(pkg + '=' + require.resolve(pkg)); }
            catch { console.log(pkg + '=missing'); }
          }
          NODE
          if [ -x node_modules/.bin/prettier ]; then node_modules/.bin/prettier --version; fi
          if [ -x node_modules/.bin/biome ]; then node_modules/.bin/biome --version; fi
