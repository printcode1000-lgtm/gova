name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Inspect deploy checkpoints
        shell: bash
        run: |
          set -euo pipefail
          cd /home/hesham/gova
          echo '=== PROCESSES ==='
          ps -eo pid,etimes,cmd | grep -E 'deploy-all|run-generated-gate|next build|services:build|smoke:|vercel' | grep -v grep || true
          echo '=== DEPLOY DIR ==='
          ls -la .deploy-all 2>/dev/null || true
          echo '=== CHECKPOINTS ==='
          cat .deploy-all/branch-checkpoints.json 2>/dev/null || true
          echo '=== OTHER JSON STATE ==='
          for f in .deploy-all/*.json; do
            [ -f "$f" ] || continue
            [ "$f" = .deploy-all/branch-checkpoints.json ] && continue
            echo "--- $f ---"
            cat "$f"
          done
