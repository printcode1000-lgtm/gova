name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Measure human-authored line lengths on main HEAD
        shell: bash
        run: |
          set -euo pipefail
          cd /home/hesham/gova
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          root=Path('src/features/google-play-console/presentation')
          files=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD',str(root)],text=True).splitlines()
          bad=[]
          for f in files:
              if not f.endswith('.tsx'): continue
              src=subprocess.check_output(['git','show',f'HEAD:{f}'],text=True)
              for i,line in enumerate(src.splitlines(),1):
                  normalized=re.sub(r'\s+id=(?:"[^"]*"|\'[^\']*\'|\{[^{}]*\})','',line)
                  if len(normalized)>120:
                      bad.append((f,i,len(line),len(normalized),line))
          print('REMAINING',len(bad))
          for row in bad:
              print(f'{row[0]}:{row[1]} raw={row[2]} normalized={row[3]}:{row[4]}')
          PY
