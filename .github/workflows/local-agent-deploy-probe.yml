name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 60
    steps:
      - name: Repair and verify service smoke through Gateway
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/gova-service-smoke-repair.sh <<'SH_REPAIR'
          set -euo pipefail
          echo '=== BASE STATE ==='
          git status --short --branch
          git rev-parse HEAD
          echo '=== CONTEXT PACK ==='
          npx tsx scripts/docs/context.ts scripts/build-all-services.ts scripts/check-service-smoke.ts packages/env-core/src/domain/load-release-environment.ts docs/08-troubleshooting/problems/README.md

          cat > scripts/service-release-environment.ts <<'EOF_HELPER'
          import { loadReleaseToolEnvironment } from "@asol/env-core/process";

          /**
           * Build a server-service environment from the release-tool sources while
           * explicitly clearing static-export mode. The caller environment is not mutated.
           */
          export function createServiceReleaseEnvironment(
            cwd: string,
            baseEnv: NodeJS.ProcessEnv = process.env,
          ): NodeJS.ProcessEnv {
            const env: NodeJS.ProcessEnv = { ...baseEnv };
            loadReleaseToolEnvironment({ cwd, env });
            delete env.ASOL_MODE;
            delete env.NEXT_PUBLIC_ASOL_MODE;
            return env;
          }
          EOF_HELPER

          python3 - <<'PY_PATCH'
          from pathlib import Path

          p=Path('scripts/build-all-services.ts')
          s=p.read_text()
          if 'createServiceReleaseEnvironment' not in s:
              s=s.replace(
                  "import { RELEASE_WORKLOADS } from '@asol/vercel-deploy-core';\n",
                  "import { RELEASE_WORKLOADS } from '@asol/vercel-deploy-core';\nimport { createServiceReleaseEnvironment } from './service-release-environment';\n",
                  1,
              )
              s=s.replace(
                  "const ROOT = process.cwd();\n\nfunction run(command: string, args: string[], cwd: string): void {\n  execFileSync(command, args, { stdio: 'inherit', shell: process.platform === 'win32', cwd });\n}\n",
                  "const ROOT = process.cwd();\nconst SERVICE_ENV = createServiceReleaseEnvironment(ROOT);\n\nfunction run(command: string, args: string[], cwd: string): void {\n  execFileSync(command, args, {\n    stdio: 'inherit',\n    shell: process.platform === 'win32',\n    cwd,\n    env: SERVICE_ENV,\n  });\n}\n",
                  1,
              )
          p.write_text(s)

          p=Path('scripts/check-service-smoke.ts')
          s=p.read_text()
          if 'createServiceReleaseEnvironment' not in s:
              s=s.replace(
                  '} from "@asol/release-core";\n',
                  '} from "@asol/release-core";\nimport { createServiceReleaseEnvironment } from "./service-release-environment";\n',
                  1,
              )
              s=s.replace(
                  'const STARTUP_TIMEOUT_MS = 90_000;\n',
                  'const STARTUP_TIMEOUT_MS = 90_000;\nconst SERVICE_ENV = createServiceReleaseEnvironment(process.cwd());\n',
                  1,
              )
              s=s.replace(
                  '      cwd: serviceDir,\n    });\n',
                  '      cwd: serviceDir,\n      env: SERVICE_ENV,\n    });\n',
                  1,
              )
              s=s.replace(
                  '    env: { ...process.env, NODE_ENV: "production" },\n',
                  '    env: { ...SERVICE_ENV, NODE_ENV: "production" },\n',
                  1,
              )
          p.write_text(s)
          PY_PATCH

          mkdir -p scripts/tests
          cat > scripts/tests/service-release-environment.test.ts <<'EOF_TEST'
          import assert from "node:assert/strict";
          import { mkdtempSync, rmSync, writeFileSync } from "node:fs";
          import os from "node:os";
          import path from "node:path";

          import { createServiceReleaseEnvironment } from "../service-release-environment";

          const cwd = mkdtempSync(path.join(os.tmpdir(), "gova-service-release-env-"));
          try {
            writeFileSync(
              path.join(cwd, ".env.local"),
              [
                "TURSO_PRODUCT_DATABASE_URL=from-file",
                "TURSO_PRODUCT_AUTH_TOKEN=file-token",
                "ASOL_MODE=static",
                "NEXT_PUBLIC_ASOL_MODE=static",
                "",
              ].join("\n"),
            );

            const baseEnv: NodeJS.ProcessEnv = {
              TURSO_PRODUCT_AUTH_TOKEN: "process-token",
              ASOL_MODE: "static",
              NEXT_PUBLIC_ASOL_MODE: "static",
            };
            const env = createServiceReleaseEnvironment(cwd, baseEnv);

            assert.equal(env.TURSO_PRODUCT_DATABASE_URL, "from-file");
            assert.equal(env.TURSO_PRODUCT_AUTH_TOKEN, "process-token");
            assert.equal(env.ASOL_MODE, undefined);
            assert.equal(env.NEXT_PUBLIC_ASOL_MODE, undefined);
            assert.equal(baseEnv.ASOL_MODE, "static");
            assert.equal(baseEnv.NEXT_PUBLIC_ASOL_MODE, "static");
            assert.equal(baseEnv.TURSO_PRODUCT_DATABASE_URL, undefined);
            console.log("service release environment: PASS");
          } finally {
            rmSync(cwd, { recursive: true, force: true });
          }
          EOF_TEST

          cat > docs/08-troubleshooting/problems/service-smoke-release-environment.md <<'EOF_DOC'
          # Service smoke fails after successful service builds

          ## Symptom

          `services:build` succeeds, but `smoke:services` fails when a service starts with missing Turso configuration, or a server service reports that database access is unavailable during static export.

          ## Cause

          The service build and smoke scripts inherited only the ambient shell environment. Release credentials are normally sourced by release tooling from `.env.local`, `.env`, and `fastlane/.env`, so a valid release could reach service smoke without those values. A preceding static build could also leave `ASOL_MODE` / `NEXT_PUBLIC_ASOL_MODE` in the inherited environment and make a server service build as a static target.

          ## Fix

          Server-service build and smoke commands use `createServiceReleaseEnvironment()`. It clones the caller environment, fills missing release values through `@asol/env-core/process`, then removes both static-mode markers before any service build or start. Existing process values keep precedence.

          `NODE_ENV=production` is added only when `next start` runs, not during dependency installation, so `npm ci` keeps the build dependencies required by an isolated Vercel service.

          ## Verification

          ```bash
          npx tsx scripts/tests/service-release-environment.test.ts
          npm run services:build
          npm run smoke:services
          ```

          Do not hard-code secrets, copy credentials into service folders, or weaken the data-reaching smoke probes.
          EOF_DOC

          python3 - <<'PY_DOC'
          from pathlib import Path
          p=Path('docs/08-troubleshooting/problems/README.md')
          s=p.read_text()
          entry='| 26 | Service smoke fails after successful builds: release env missing or static mode leaked | [service-smoke-release-environment.md](./service-smoke-release-environment.md) |\n'
          if 'service-smoke-release-environment.md' not in s:
              p.write_text(s + ('' if s.endswith('\n') else '\n') + entry)
          PY_DOC

          echo '=== FOCUSED TEST ==='
          npx tsx scripts/tests/service-release-environment.test.ts
          git diff --check

          created=()
          cleanup() { for x in "${created[@]}"; do rm -f "$x"; done; }
          trap cleanup EXIT
          for rel in node_modules .env.local .env fastlane/.env; do
            src="/home/hesham/gova/$rel"; dst="$PWD/$rel"
            if [ -e "$src" ] && [ ! -e "$dst" ]; then
              mkdir -p "$(dirname "$dst")"; ln -s "$src" "$dst"; created+=("$dst")
            fi
          done
          for svc in notifications products orders profiles submain sub2main; do
            src="/home/hesham/gova/services/$svc/node_modules"; dst="$PWD/services/$svc/node_modules"
            if [ -d "$src" ] && [ ! -e "$dst" ]; then ln -s "$src" "$dst"; created+=("$dst"); fi
          done

          echo '=== SERVICES BUILD ==='
          npm run services:build
          echo '=== SERVICE SMOKE ==='
          npm run smoke:services
          cleanup
          trap - EXIT

          echo '=== FINAL DIFF ==='
          git status --short
          git diff --check
          git add scripts/build-all-services.ts scripts/check-service-smoke.ts scripts/service-release-environment.ts scripts/tests/service-release-environment.test.ts docs/08-troubleshooting/problems/README.md docs/08-troubleshooting/problems/service-smoke-release-environment.md
          git diff --cached --check
          git commit -m 'fix(release): load server service environment for smoke gate'
          git rev-parse HEAD
          git status --short
          SH_REPAIR

          python3 - <<'PY_GATEWAY'
          import json, time, urllib.request
          from pathlib import Path
          base='http://127.0.0.1:8765'
          key=Path('/home/hesham/.config/gova-agent/auth').read_text().strip()
          headers={'X-Gova-Agent-Key':key,'Content-Type':'application/json'}
          agent='chatgpt-service-smoke-fix'
          worktree='/home/hesham/gova-agents/chatgpt-service-smoke-fix/task-6da808b04d6f'
          def req(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=60) as resp:
                  body=resp.read().decode()
              return json.loads(body) if body else {}
          req('POST','/v1/agent/register',{'agent_id':agent})
          command=Path('/tmp/gova-service-smoke-repair.sh').read_text()
          started=req('POST','/v1/exec/start',{'agent_id':agent,'command':command,'cwd':worktree})
          print('STARTED',started)
          cid=started.get('command_id') or (started.get('command') or {}).get('id')
          if not cid: raise SystemExit('command id not found')
          while True:
              state=req('GET','/v1/commands/'+cid)
              c=state.get('command') or state
              status=c.get('status')
              print('STATUS',status)
              if status in {'completed','failed','cancelled','canceled'}: break
              time.sleep(5)
          logs=req('GET','/v1/commands/'+cid+'/logs?tail=260000')
          print('=== GATEWAY LOGS ===')
          print(logs.get('logs') or logs.get('output') or logs)
          code=c.get('exit_code')
          print('EXIT_CODE',code)
          if status!='completed' or code not in (0,None): raise SystemExit(code or 1)
          PY_GATEWAY
