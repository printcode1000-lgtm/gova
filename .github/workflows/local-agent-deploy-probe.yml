name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Inspect live deploy progress
        shell: bash
        run: |
          set -euo pipefail
          cd /home/hesham/gova
          echo '=== PROCESSES ==='
          ps -eo pid,etimes,cmd | grep -E 'deploy-all|run-generated-gate|next build|services:build|smoke:|vercel' | grep -v grep || true
          echo '=== RECENT STATE FILES ==='
          find . -maxdepth 5 -type f -mmin -15 \( -iname '*deploy*state*' -o -iname '*checkpoint*' -o -iname '*release*state*' \) -print 2>/dev/null | head -50
          echo '=== RELEASE STATE CONSTANTS ==='
          grep -R -n "deploy.*state\|branch.*checkpoint" packages/release-core/src 2>/dev/null | head -80 || true
