name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 120
    steps:
      - name: Resume deploy on canonical local workspace
        shell: bash
        run: |
          set -euo pipefail
          cd /home/hesham/gova
          git fetch --quiet origin main
          unexpected="$(git status --porcelain | awk '$2 !~ /^public\/sync_data\/.*schema-sync-report\.json$/ {print}')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected local changes:" >&2
            echo "$unexpected" >&2
            exit 2
          fi
          git restore -- public/sync_data/*schema-sync-report.json
          if [ "$(git branch --show-current)" != main ]; then
            echo "Canonical workspace is not on main" >&2
            exit 2
          fi
          git pull --ff-only origin main
          npm run test:release-commands
          npm run deploy:all -- --from-branch=tests
