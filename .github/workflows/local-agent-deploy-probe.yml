name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  scan:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Scan presentation line lengths
        shell: bash
        run: |
          set -euo pipefail
          cd /home/hesham/gova
          git fetch --quiet origin main
          git restore -- public/sync_data/*schema-sync-report.json 2>/dev/null || true
          git pull --ff-only origin main
          find src/features/google-play-console/presentation -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | \
            xargs -0 awk 'length($0)>120 {print FILENAME ":" FNR ":" length($0) ":" $0}'
