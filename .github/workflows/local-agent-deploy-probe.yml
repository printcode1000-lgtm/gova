name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 120
    steps:
      - name: Repair main and resume deploy
        shell: bash
        run: |
          set -euo pipefail
          repo=/home/hesham/gova
          cd "$repo"
          git fetch --quiet origin main
          unexpected="$(git status --porcelain | awk '$2 !~ /^public\/sync_data\/.*schema-sync-report\.json$/ {print}')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected local changes:" >&2
            echo "$unexpected" >&2
            exit 2
          fi
          git restore -- public/sync_data/*schema-sync-report.json 2>/dev/null || true
          if [ "$(git branch --show-current)" != main ]; then
            echo "Canonical workspace is not on main" >&2
            exit 2
          fi
          git pull --ff-only origin main
          node_modules/.bin/prettier --write "src/features/google-play-console/presentation/**/*.tsx" --print-width 120
          npm run test:release-commands
          if [ -n "$(git status --porcelain)" ]; then
            git add src/features/google-play-console/presentation
            git commit -m "style(release): format Google Play presentation" >/dev/null
            git push origin HEAD:main
          fi
          npm run deploy:all -- --from-branch=tests
