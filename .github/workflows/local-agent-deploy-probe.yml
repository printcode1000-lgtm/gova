name: local-agent-deploy-probe
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/local-agent-deploy-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 20
    steps:
      - name: Diagnose failed service smoke at current release checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd /home/hesham/gova
          echo '=== MACHINE ==='
          hostname
          git status --short --branch
          git rev-parse HEAD
          echo '=== GATEWAY ==='
          curl -fsS http://127.0.0.1:8765/health || true
          echo
          echo '=== CONTEXT ==='
          npx tsx scripts/docs/context.ts scripts/check-service-smoke.ts
          echo '=== TARGETED CHECKPOINT ==='
          npm run smoke:services
