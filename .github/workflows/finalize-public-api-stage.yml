name: Finalize Public API Stage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-public-api-stage.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply Public API finalizer
        run: python scripts/refactor/__tmp_finalize_feature_public_api.py
      - run: npm run architecture:docs
      - name: Verify Public API architecture
        shell: bash
        run: |
          set -o pipefail
          {
            npm run architecture:check
            npm run test:architecture-core
            npm run test:notifications
            npm run test:release-commands
            npm run test:compositions
            npm run typecheck
          } 2>&1 | tee /tmp/public-api-stage.log
      - name: Commit verified stage
        shell: bash
        run: |
          rm -f scripts/refactor/__tmp_finalize_feature_public_api.py
          rm -f .github/workflows/finalize-public-api-stage.yml
          git config user.name "printcode1000-lgtm"
          git config user.email "print.code.1000@gmail.com"
          git add -A
          git commit -m "refactor(architecture): enforce feature public APIs without seams"
          git push origin main
