name: ui-identity-duplicate-cleanup-one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-identity-duplicate-cleanup-one-shot.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Make repeated simulation selection explicit
        run: node scripts/ui-registry/make-simulation-selection-explicit.mjs
      - name: Regenerate canonical UiRegistry artifacts
        run: |
          npm run ui-registry:generated-catalog:generate
          npm run ui-registry:component-bridge:generate
          npm run ui-registry:simulation:generate
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require explicit repeated simulation selection"
          git push origin HEAD:main
