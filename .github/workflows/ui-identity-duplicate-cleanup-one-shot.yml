name: ui-identity-duplicate-cleanup-one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-identity-duplicate-cleanup-one-shot.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Migrate direct iterator instances with AST-safe imports
        run: npx tsx scripts/ui-registry/migrate-direct-iterator-instances.ts
      - name: Regenerate canonical UiRegistry artifacts
        run: |
          npm run ui-registry:generated-catalog:generate
          npm run ui-registry:component-bridge:generate
          npm run ui-registry:simulation:generate
      - name: Verify immediate identity contracts
        run: |
          npm run ui-registry:uid-coverage:check
          npm run ui-registry:generated-catalog:check
          npm run ui-registry:component-bridge:check
          npm run ui-registry:static-dom-ids:check
          npm run typecheck
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src packages scripts
          if git diff --cached --quiet; then
            echo "No iterator migration changes"
            exit 0
          fi
          git commit -m "Stage 116: scope direct iterator DOM copies"
          git push origin HEAD:main
