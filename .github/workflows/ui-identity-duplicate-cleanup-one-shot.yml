name: ui-identity-duplicate-cleanup-one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-identity-duplicate-cleanup-one-shot.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add duplicate JSX attribute guard
        run: node scripts/ui-registry/add-duplicate-jsx-guard.mjs
      - name: Commit guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard duplicate JSX attributes in architecture checks"
          git push origin HEAD:main
