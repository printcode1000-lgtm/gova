name: ui-runtime-multiplicity-audit-one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-runtime-multiplicity-audit-one-shot.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Runtime multiplicity summary
        run: npx tsx scripts/ui-registry/runtime-multiplicity-summary.ts
