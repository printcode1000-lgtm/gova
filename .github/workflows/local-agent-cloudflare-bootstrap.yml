name: local-agent-cloudflare-bootstrap
on:
  push:
    branches: [main]
    paths:
      - 'tools/local-agent/.cloudflare-bootstrap-trigger'
permissions:
  contents: read
jobs:
  inspect-and-configure:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 15
    steps:
      - name: Discover existing Gova R2 configuration safely
        shell: bash
        run: |
          set -euo pipefail
          echo '=== GOVA_R2_DISCOVERY_BEGIN ==='
          echo "gateway_public_status:"
          /home/hesham/.local/bin/gova-agent-public status || true
          echo '--- candidate-files ---'
          find /home/hesham/gova -xdev -type f \( -name '.env' -o -name '.env.*' -o -name 'r2.env' -o -name '*r2*.env' \) \
            -not -path '*/node_modules/*' -not -path '*/.git/*' -print 2>/dev/null | sort | head -100 || true
          echo '--- files-containing-required-r2-variable-names ---'
          grep -RIl --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next \
            -E 'R2_ACCOUNT_ID|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|R2_BUCKET' /home/hesham/gova 2>/dev/null | sort | head -100 || true
          echo '--- config-status ---'
          if [ -s /home/hesham/.config/gova-agent/r2.env ]; then
            echo 'gova_agent_r2_env=present'
            for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL; do
              if grep -q "^${key}=" /home/hesham/.config/gova-agent/r2.env; then echo "${key}=present"; else echo "${key}=missing"; fi
            done
          else
            echo 'gova_agent_r2_env=missing'
          fi
          echo '=== GOVA_R2_DISCOVERY_END ==='
