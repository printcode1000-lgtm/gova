name: local-agent-cloudflare-bootstrap
on:
  push:
    branches: [main]
    paths:
      - 'tools/local-agent/.cloudflare-bootstrap-trigger'
permissions:
  contents: read
jobs:
  bootstrap-and-verify:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Install current integration runtime and verify public discovery
        shell: bash
        run: |
          set -euo pipefail
          git -C /home/hesham/gova fetch --quiet origin integration
          mkdir -p /home/hesham/gova-agents
          if [ ! -e /home/hesham/gova-agents/integration/.git ]; then
            git -C /home/hesham/gova worktree add /home/hesham/gova-agents/integration integration
          fi
          git -C /home/hesham/gova-agents/integration checkout integration >/dev/null 2>&1
          git -C /home/hesham/gova-agents/integration reset --hard origin/integration
          GOVA_AGENT_REPO=/home/hesham/gova-agents/integration bash /home/hesham/gova-agents/integration/tools/local-agent/install.sh
          echo '--- local public status ---'
          /home/hesham/.local/bin/gova-agent-public status
          echo '--- tunnel health ---'
          /home/hesham/.local/bin/gova-agent-public health
          echo '--- publish discovery ---'
          discovery_url="$(/home/hesham/.local/bin/gova-agent-public publish)"
          printf 'discovery_url=%s\n' "$discovery_url"
          case "$discovery_url" in
            https://*) curl -fsS --max-time 15 "$discovery_url" ; printf '\n' ;;
            *) echo 'publisher did not return a public discovery URL' >&2; exit 1 ;;
          esac
