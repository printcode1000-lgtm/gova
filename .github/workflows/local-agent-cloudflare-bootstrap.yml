name: local-agent-cloudflare-bootstrap
on:
  push:
    branches: [main]
    paths:
      - 'tools/local-agent/.cloudflare-bootstrap-trigger'
permissions:
  contents: read
jobs:
  inspect-and-configure:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 5
    steps:
      - name: Discover existing Gova R2 configuration safely
        shell: bash
        run: |
          set -euo pipefail
          echo '=== GOVA_R2_DISCOVERY_BEGIN ==='
          /home/hesham/.local/bin/gova-agent-public status || true
          echo '--- candidate-files ---'
          timeout 10s find /home/hesham/gova -maxdepth 6 -xdev -type f \( -name '.env' -o -name '.env.*' -o -name 'r2.env' -o -name '*r2*.env' \) \
            -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/.next/*' -print 2>/dev/null | sort | head -100 || true
          echo '--- matching-files ---'
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if grep -Eq '^(R2_ACCOUNT_ID|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|R2_BUCKET|CLOUDFLARE_R2_)=' "$f" 2>/dev/null; then
              echo "$f"
            fi
          done < <(timeout 10s find /home/hesham/gova -maxdepth 6 -xdev -type f \( -name '.env' -o -name '.env.*' -o -name 'r2.env' -o -name '*r2*.env' \) -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/.next/*' -print 2>/dev/null || true)
          echo '--- config-status ---'
          if [ -s /home/hesham/.config/gova-agent/r2.env ]; then
            echo 'gova_agent_r2_env=present'
            for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL; do
              grep -q "^${key}=" /home/hesham/.config/gova-agent/r2.env && echo "${key}=present" || echo "${key}=missing"
            done
          else
            echo 'gova_agent_r2_env=missing'
          fi
          echo '=== GOVA_R2_DISCOVERY_END ==='
