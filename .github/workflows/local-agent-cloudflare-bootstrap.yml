name: local-agent-cloudflare-bootstrap
on:
  push:
    branches: [main]
    paths:
      - 'tools/local-agent/.cloudflare-bootstrap-trigger'
permissions:
  contents: read
jobs:
  verify-current-public-discovery:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 5
    steps:
      - name: Verify current tunnel and R2 discovery without restart
        shell: bash
        run: |
          set -euo pipefail
          systemctl --user is-active --quiet gova-agent-public.service
          /home/hesham/.local/bin/gova-agent-public status
          local_url="$(/home/hesham/.local/bin/gova-agent-public url)"
          discovery_url="$(/home/hesham/.local/bin/gova-agent-public publish)"
          printf 'discovery_url=%s\n' "$discovery_url"
          case "$discovery_url" in
            https://*) ;;
            *) echo 'publisher did not return a public discovery URL' >&2; exit 1 ;;
          esac
          discovery_json="$(curl -fsS --retry 5 --retry-delay 1 --max-time 15 "$discovery_url")"
          DISCOVERY_JSON="$discovery_json" LOCAL_URL="$local_url" python3 -c "import json,os; obj=json.loads(os.environ['DISCOVERY_JSON']); expected=os.environ['LOCAL_URL']; assert obj.get('service')=='gova-agent-gateway',obj; assert obj.get('url')==expected,(obj.get('url'),expected); assert obj.get('health')==expected.rstrip('/')+'/health',obj; print(json.dumps({'r2_discovery':'ok','url':obj['url'],'health':obj['health'],'updatedAt':obj.get('updatedAt')},ensure_ascii=False))"
