name: ASOL Production Cutover

on:
  push:
    branches:
      - "agent-request/chatgpt"
    paths:
      - ".github/workflows/asol-production-cutover.yml"

permissions:
  contents: write

defaults:
  run:
    working-directory: /home/hesham/gova

jobs:
  cutover:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 330
    concurrency:
      group: asol-production-cutover
      cancel-in-progress: false
    env:
      INITIAL_SHA: c673e2a595e8a88224dd444281058d299dbf8a67
      GH_PUSH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve sensitive env types and execute production transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/home/hesham/gova
          cd "$ROOT"
          echo "=== ASOL PRODUCTION CUTOVER SENSITIVE ENV FIX ==="
          echo "runner=$(hostname)"
          git fetch origin main
          [[ "$(git branch --show-current)" == "main" ]] || { echo "PRODUCTION_PREFLIGHT=FAIL not-main"; exit 42; }
          [[ "$(git rev-parse origin/main)" == "$INITIAL_SHA" ]] || { echo "PRODUCTION_PREFLIGHT=FAIL unexpected-main"; exit 43; }
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "PRODUCTION_PREFLIGHT=FAIL dirty-workspace"
            git status --short
            exit 41
          fi
          git merge --ff-only origin/main

          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/vercel-deploy-core/src/index.ts')
          s=p.read_text()
          old="body: JSON.stringify({ value, type: 'encrypted' }),"
          new="body: JSON.stringify({ value }),"
          if old not in s: raise SystemExit('existing env PATCH body not found')
          s=s.replace(old,new,1)
          s=s.replace("// keeps production/preview/development scopes exactly as configured.", "// keeps production/preview/development scopes and Sensitive/encrypted types exactly as configured.",1)
          p.write_text(s)

          t=Path('packages/vercel-deploy-core/src/tests/index.test.ts')
          s=t.read_text()
          old_assert="  assert(indexSource.includes(\"JSON.stringify({ value, type: 'encrypted' })\"), 'D4: existing target scopes are preserved during PATCH');\n"
          new_assert="  assert(indexSource.includes('body: JSON.stringify({ value })'), 'D4: existing target scopes and Sensitive/encrypted types are preserved during PATCH');\n"
          if old_assert not in s: raise SystemExit('existing env PATCH test not found')
          t.write_text(s.replace(old_assert,new_assert,1))

          d=Path('docs/07-mobile-and-release/scripts-and-workflows.md')
          s=d.read_text()
          old='Gova env reconciliation preserves existing Vercel target scopes when the same key has separate production, preview, or development entries; it updates every matching entry without widening its targets.\n'
          new='Gova env reconciliation preserves existing Vercel target scopes and variable types (including Sensitive entries) when a key already exists; it updates every matching entry by value only, without widening targets or changing type.\n'
          if old not in s: raise SystemExit('env target docs note not found')
          d.write_text(s.replace(old,new,1))
          PY

          npm run test:vercel-deploy-core
          npm run test:deployment-tools
          npm run typecheck
          npm run docs:generate
          DOCS_CONTRACT_CHANGE=1 npm run docs:ci
          npm run github:ci-policy

          git add packages/vercel-deploy-core/src/index.ts packages/vercel-deploy-core/src/tests/index.test.ts docs/07-mobile-and-release/scripts-and-workflows.md docs/09-agent-knowledge/generated
          git commit -m "fix: preserve Vercel sensitive env types [docs-contract-change]"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/printcode1000-lgtm/gova.git" "HEAD:main"
          echo "RELEASE_CODE_SHA=$RELEASE_SHA"

          export NEXT_PUBLIC_ASOL_CONTROL_URL="${NEXT_PUBLIC_ASOL_CONTROL_URL:-https://asol-control.vercel.app}"
          export NEXT_PUBLIC_ASOL_SUBMAIN_URL="${NEXT_PUBLIC_ASOL_SUBMAIN_URL:-https://asol-submain.vercel.app}"
          export NEXT_PUBLIC_ASOL_SUB2MAIN_URL="${NEXT_PUBLIC_ASOL_SUB2MAIN_URL:-https://asol-sub2main.vercel.app}"
          echo "=== GOVA ENV RECONCILIATION ==="
          npm run db:push:vercel-env
          echo "GOVA_ENV_SYNC=PASS"

          echo "=== RELEASE TRANSACTION ==="
          npm run deploy:all -- --allow-empty
          echo "DEPLOY_ALL=PASS"

          echo "=== LIVE RELEASE VERIFICATION ==="
          npm run release:check
          npm run smoke:deployed
          npm run smoke:production
          echo "PRODUCTION_VERIFICATION=PASS"
          echo "PRODUCTION_RELEASE_SHA=$(git rev-parse HEAD)"
          echo "ASOL_PRODUCTION_COMPLETE=PASS"
