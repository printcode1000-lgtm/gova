name: ASOL Production Cutover

on:
  push:
    branches:
      - "agent-request/chatgpt"
    paths:
      - ".github/workflows/asol-production-cutover.yml"

permissions:
  contents: write

defaults:
  run:
    working-directory: /home/hesham/gova

jobs:
  cutover:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 330
    concurrency:
      group: asol-production-cutover
      cancel-in-progress: false
    env:
      INITIAL_SHA: cf905aff947022a48213b6f940c78c5ad57bafd7
      GH_PUSH_TOKEN: ${{ github.token }}
    steps:
      - name: Fix duplicate env upsert and execute production transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/home/hesham/gova
          cd "$ROOT"
          echo "=== ASOL PRODUCTION CUTOVER FINAL FIX ==="
          echo "runner=$(hostname)"
          git fetch origin main
          [[ "$(git branch --show-current)" == "main" ]] || { echo "PRODUCTION_PREFLIGHT=FAIL not-main"; exit 42; }
          [[ "$(git rev-parse origin/main)" == "$INITIAL_SHA" ]] || { echo "PRODUCTION_PREFLIGHT=FAIL unexpected-main"; exit 43; }
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "PRODUCTION_PREFLIGHT=FAIL dirty-workspace"
            git status --short
            exit 41
          fi
          git merge --ff-only origin/main

          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/vercel-deploy-core/src/index.ts')
          s=p.read_text()
          old='''  const target = ['production', 'preview', 'development'];\n  const match = existing.find((item) => item.key === key);\n\n  const response = match\n    ? await fetch(\n        withTeam(`https://api.vercel.com/v9/projects/${projectId}/env/${match.id}`, teamId),\n        {\n          method: 'PATCH',\n          headers: buildHeaders(token),\n          body: JSON.stringify({ value, target, type: 'encrypted' }),\n        },\n      )\n    : await fetch(withTeam(`https://api.vercel.com/v10/projects/${projectId}/env`, teamId), {\n        method: 'POST',\n        headers: buildHeaders(token),\n        body: JSON.stringify({ key, value, target, type: 'encrypted' }),\n      });\n\n  if (!response.ok) {\n    throw new Error(\n      `Failed to ${match ? 'update' : 'create'} ${key}: ${response.status} ${await response.text()}`,\n    );\n  }\n  return match ? 'updated' : 'created';'''
          new='''  const target = ['production', 'preview', 'development'];\n  const matches = existing.filter((item) => item.key === key);\n\n  if (matches.length > 0) {\n    for (const match of matches) {\n      const response = await fetch(\n        withTeam(`https://api.vercel.com/v9/projects/${projectId}/env/${match.id}`, teamId),\n        {\n          method: 'PATCH',\n          headers: buildHeaders(token),\n          // Preserve each existing entry's target scope. Vercel permits the same\n          // key in separate target entries; expanding one entry to all targets\n          // collides with its siblings. PATCHing value/type only is atomic and\n          // keeps production/preview/development scopes exactly as configured.\n          body: JSON.stringify({ value, type: 'encrypted' }),\n        },\n      );\n      if (!response.ok) {\n        throw new Error(`Failed to update ${key}: ${response.status} ${await response.text()}`);\n      }\n    }\n    return 'updated';\n  }\n\n  const response = await fetch(withTeam(`https://api.vercel.com/v10/projects/${projectId}/env`, teamId), {\n    method: 'POST',\n    headers: buildHeaders(token),\n    body: JSON.stringify({ key, value, target, type: 'encrypted' }),\n  });\n  if (!response.ok) {\n    throw new Error(`Failed to create ${key}: ${response.status} ${await response.text()}`);\n  }\n  return 'created';'''
          if old not in s: raise SystemExit('writeProjectEnv block not found')
          p.write_text(s.replace(old,new,1))

          t=Path('packages/vercel-deploy-core/src/tests/index.test.ts')
          s=t.read_text()
          needle="  assert(indexSource.includes('/env?limit=100'), 'D4: project env listing covers the full gova env set before upsert/cleanup');\n"
          addition=needle+"  assert(indexSource.includes('existing.filter((item) => item.key === key)'), 'D4: duplicate same-key env entries are all updated');\n  assert(indexSource.includes(\"JSON.stringify({ value, type: 'encrypted' })\"), 'D4: existing target scopes are preserved during PATCH');\n"
          if "existing.filter((item) => item.key === key)" not in s:
              if needle not in s: raise SystemExit('duplicate-env test insertion point missing')
              t.write_text(s.replace(needle,addition,1))

          d=Path('docs/07-mobile-and-release/scripts-and-workflows.md')
          s=d.read_text()
          note='Gova env reconciliation preserves existing Vercel target scopes when the same key has separate production, preview, or development entries; it updates every matching entry without widening its targets.\n'
          if note not in s:
              anchor='Gova environment reconciliation requests up to 100 project environment entries before upsert and cleanup, so existing optional or legacy variables cannot be missed by the Vercel API default page size.\n'
              if anchor not in s: raise SystemExit('docs env reconciliation note missing')
              d.write_text(s.replace(anchor,anchor+note,1))
          PY

          npm run test:vercel-deploy-core
          npm run test:deployment-tools
          npm run typecheck
          npm run docs:generate
          DOCS_CONTRACT_CHANGE=1 npm run docs:ci
          npm run github:ci-policy

          git add packages/vercel-deploy-core/src/index.ts packages/vercel-deploy-core/src/tests/index.test.ts docs/07-mobile-and-release/scripts-and-workflows.md docs/09-agent-knowledge/generated
          git commit -m "fix: preserve Vercel env target scopes [docs-contract-change]"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/printcode1000-lgtm/gova.git" "HEAD:main"
          echo "RELEASE_CODE_SHA=$RELEASE_SHA"

          export NEXT_PUBLIC_ASOL_CONTROL_URL="${NEXT_PUBLIC_ASOL_CONTROL_URL:-https://asol-control.vercel.app}"
          export NEXT_PUBLIC_ASOL_SUBMAIN_URL="${NEXT_PUBLIC_ASOL_SUBMAIN_URL:-https://asol-submain.vercel.app}"
          export NEXT_PUBLIC_ASOL_SUB2MAIN_URL="${NEXT_PUBLIC_ASOL_SUB2MAIN_URL:-https://asol-sub2main.vercel.app}"
          echo "=== GOVA ENV RECONCILIATION ==="
          npm run db:push:vercel-env
          echo "GOVA_ENV_SYNC=PASS"

          echo "=== RELEASE TRANSACTION ==="
          npm run deploy:all -- --allow-empty
          echo "DEPLOY_ALL=PASS"

          echo "=== LIVE RELEASE VERIFICATION ==="
          npm run release:check
          npm run smoke:deployed
          npm run smoke:production
          echo "PRODUCTION_VERIFICATION=PASS"
          echo "PRODUCTION_RELEASE_SHA=$(git rev-parse HEAD)"
          echo "ASOL_PRODUCTION_COMPLETE=PASS"
