name: ASOL Production Cutover

on:
  push:
    branches: ["agent-request/chatgpt"]
    paths: [".github/workflows/asol-production-cutover.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: /home/hesham/gova

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 15
    concurrency:
      group: asol-production-cutover
      cancel-in-progress: false
    steps:
      - name: Read durable deploy state
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /home/hesham/gova
          echo "=== CUTOVER DURABLE STATE ==="
          echo "runner=$(hostname)"
          git fetch origin main
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          echo "origin_main=$(git rev-parse origin/main)"
          echo "--- git status ---"
          git status --short
          echo "--- run-state ---"
          if [[ -f .deploy-all/run-state.json ]]; then cat .deploy-all/run-state.json; else echo MISSING; fi
          echo "--- branch checkpoints (status only) ---"
          if [[ -f .deploy-all/branch-checkpoints.json ]]; then
            node - <<'NODE'
          const fs=require('fs');
          const p='.deploy-all/branch-checkpoints.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          console.log(JSON.stringify({runId:d.runId,checkpoints:(d.checkpoints||[]).map(x=>({branchId:x.branchId,phase:x.phase,status:x.status,errorSummary:x.errorSummary,finishedAt:x.finishedAt,revision:x.revision}))},null,2));
          NODE
          else echo MISSING; fi
          echo "--- in-flight ---"
          if [[ -f .deploy-all/in-flight.lock ]]; then cat .deploy-all/in-flight.lock; else echo NONE; fi
          echo "CUTOVER_DIAGNOSTIC_COMPLETE=PASS"
