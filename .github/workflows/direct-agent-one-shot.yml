name: direct-agent-one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-agent-one-shot.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 8
    steps:
      - name: Patch, verify, and push final direct client
        shell: bash
        run: |
          set -euo pipefail
          root=/home/hesham/gova
          export GOVA_LOCAL_WORKSPACE="$root"
          export GOVA_DIRECT_AGENT_DIR="$root/.local/direct-agent"
          git -C "$root" fetch --quiet origin main agent-request/chatgpt
          wt="$root/.local/direct-finalize-${GITHUB_RUN_ID}"
          rm -rf "$wt"
          git -C "$root" worktree add --detach "$wt" origin/main
          cleanup() { git -C "$root" worktree remove --force "$wt" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ln -s "$root/node_modules" "$wt/node_modules"

          python3 - "$wt/scripts/local-agent-direct-remote.ts" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = '''import {
            createOtaR2Client,
            deleteOtaObject,
            getOtaObjectBytes,
            getOtaPublicBaseUrl,
            loadOtaEnvironment,
            putOtaObject,
          } from "@asol/ota-core/publishing";'''
          new = '''import {
            createOtaR2Client,
            deleteOtaObject,
            getOtaObjectBytes,
            putOtaObject,
          } from "../packages/ota-core/src/publishing/adapters/r2-storage.adapter";
          import {
            getOtaPublicBaseUrl,
            loadOtaEnvironment,
          } from "../packages/ota-core/src/publishing/config/ota-config";'''
          if old not in s:
              raise SystemExit('expected OTA publishing import block not found')
          p.write_text(s.replace(old, new))
          PY

          echo '=== daemon ==='
          systemctl --user is-active gova-direct-agent.service
          ss -lnt | grep ':48732 '

          echo '=== official direct client status ==='
          cd "$root"
          timeout 45 npx tsx "$wt/scripts/local-agent-direct-remote.ts" status | tee /tmp/gova-direct-status.json
          grep -E '"path"|"workspace"|"headSha"' /tmp/gova-direct-status.json || true

          echo '=== official direct client exec ==='
          timeout 45 npx tsx "$wt/scripts/local-agent-direct-remote.ts" exec -- "printf 'P2P_REMOTE_OK\\n'; hostname; pwd" | tee /tmp/gova-direct-exec.json
          grep -q 'P2P_REMOTE_OK' /tmp/gova-direct-exec.json

          rm -f "$wt/node_modules" /tmp/gova-direct-status.json /tmp/gova-direct-exec.json
          git -C "$wt" rm .github/workflows/direct-agent-one-shot.yml
          git -C "$wt" add scripts/local-agent-direct-remote.ts
          git -C "$wt" -c user.name='gova-direct-finalizer' -c user.email='gova-direct-finalizer@users.noreply.github.com' commit -m 'Finalize direct P2P client runtime imports'
          git -C "$wt" push origin HEAD:main
