name: direct-agent-one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-agent-one-shot.yml

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 8
    steps:
      - name: Verify official direct client and remove probe
        shell: bash
        run: |
          set -euo pipefail
          root=/home/hesham/gova
          export GOVA_LOCAL_WORKSPACE="$root"
          export GOVA_DIRECT_AGENT_DIR="$root/.local/direct-agent"

          git -C "$root" fetch --quiet origin main agent-request/chatgpt
          if [ -n "$(git -C "$root" status --porcelain --untracked-files=no)" ]; then
            echo 'tracked canonical workspace is dirty; refusing destructive reset'
            git -C "$root" status --short
            exit 1
          fi
          git -C "$root" checkout -q main
          git -C "$root" reset --hard origin/main

          systemctl --user restart gova-direct-agent.service
          for i in $(seq 1 20); do
            state=$(systemctl --user is-active gova-direct-agent.service || true)
            if [ "$state" = active ] && ss -lnt | grep -q ':48732 '; then break; fi
            sleep 1
          done
          echo "service=$state"
          ss -lnt | grep ':48732 '

          cd "$root"
          echo '=== official status ==='
          set +e
          timeout 30 npx tsx scripts/local-agent-direct-remote.ts status > /tmp/gova-direct-final-status.json 2> /tmp/gova-direct-final-status.err
          status_code=$?
          set -e
          cat /tmp/gova-direct-final-status.json || true
          cat /tmp/gova-direct-final-status.err >&2 || true
          if [ "$status_code" -ne 0 ]; then
            echo "status_exit=$status_code"
            journalctl --user -u gova-direct-agent.service -n 80 --no-pager || true
            exit "$status_code"
          fi
          grep -q 'loopback:tcp:127.0.0.1:48732' /tmp/gova-direct-final-status.json

          echo '=== official exec ==='
          timeout 30 npx tsx scripts/local-agent-direct-remote.ts exec -- "printf 'P2P_MAIN_OK\\n'; hostname; pwd" | tee /tmp/gova-direct-final-exec.json
          grep -q 'P2P_MAIN_OK' /tmp/gova-direct-final-exec.json
          grep -q 'loopback:tcp:127.0.0.1:48732' /tmp/gova-direct-final-exec.json

          rm -f /tmp/gova-direct-final-status.json /tmp/gova-direct-final-status.err /tmp/gova-direct-final-exec.json
          git rm .github/workflows/direct-agent-one-shot.yml
          git -c user.name='gova-direct-finalizer' -c user.email='gova-direct-finalizer@users.noreply.github.com' commit -m 'Remove temporary direct P2P verification workflow'
          git push origin main

          echo '=== final main ==='
          git rev-parse HEAD
          git status --short --branch
          systemctl --user is-active gova-direct-agent.service
          ss -lnt | grep ':48732 '
