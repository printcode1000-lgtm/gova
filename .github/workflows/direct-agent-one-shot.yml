name: direct-agent-one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-agent-one-shot.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 5
    steps:
      - name: Probe direct agent handshake
        shell: bash
        run: |
          set -euo pipefail
          export GOVA_LOCAL_WORKSPACE=/home/hesham/gova
          export GOVA_DIRECT_AGENT_DIR=/home/hesham/gova/.local/direct-agent
          cd /home/hesham/gova
          echo "service=$(systemctl --user is-active gova-direct-agent.service || true)"
          ss -lnt | grep ':48732 '
          echo '=== raw TLS localhost ==='
          timeout 6 openssl s_client -connect 127.0.0.1:48732 -tls1_3 -brief </dev/null 2>&1 | head -30 || true
          cat > /tmp/gova-direct-probe.ts <<'TS'
          import { spawnSync } from 'node:child_process';
          import { existsSync, readFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import {
            DEFAULT_ALLOWED_CAPABILITIES,
            DirectAgentClient,
            createBootstrapAuthRequest,
            directDiscoveryChallengePath,
            directIdentityPubPath,
            generateEphemeralKeyPair,
            hostIdentifier,
            loadOrCreateHostIdentityKey,
            readStoredBootstrapGrant,
            resolveDirectAgentPort,
            verifySignedBootstrapGrant,
          } from '/home/hesham/gova/packages/local-agent-core/src/direct/index.ts';

          const sleep=(ms:number)=>new Promise(r=>setTimeout(r,ms));
          function git(args:string[], env:NodeJS.ProcessEnv=process.env, input?:string):string {
            const r=spawnSync('git',args,{encoding:'utf8',env,input,cwd:'/home/hesham/gova'});
            if(r.status!==0) throw new Error((r.stderr||r.stdout||'git failed').trim());
            return r.stdout.trim();
          }
          function publish(req:any){
            const branch='agent-request/chatgpt';
            const p=`.agent-control/direct-auth/${req.requestId}.json`;
            for(let n=0;n<4;n++){
              git(['fetch','--quiet','origin',branch]);
              const base=git(['rev-parse',`origin/${branch}`]);
              const idx=path.join(tmpdir(),`gova-direct-probe-${process.pid}-${n}`);
              const env={...process.env,GIT_INDEX_FILE:idx,GIT_AUTHOR_NAME:'gova-direct-client',GIT_AUTHOR_EMAIL:'gova-direct-client@users.noreply.github.com',GIT_COMMITTER_NAME:'gova-direct-client',GIT_COMMITTER_EMAIL:'gova-direct-client@users.noreply.github.com'};
              try {
                git(['read-tree',`${base}^{tree}`],env);
                const blob=git(['hash-object','-w','--stdin'],env,`${JSON.stringify(req,null,2)}\n`);
                git(['update-index','--add','--cacheinfo','100644',blob,p],env);
                const tree=git(['write-tree'],env);
                const commit=git(['commit-tree',tree,'-p',base,'-m',`Direct auth ${req.requestId}`],env);
                const r=spawnSync('git',['push','--quiet','origin',`${commit}:refs/heads/${branch}`],{encoding:'utf8',env,cwd:'/home/hesham/gova'});
                if(r.status===0) return;
              } finally { if(existsSync(idx)) rmSync(idx,{force:true}); }
            }
            throw new Error('auth publish failed');
          }
          async function withTimeout<T>(p:Promise<T>, ms:number, label:string):Promise<T>{
            return Promise.race([p,new Promise<T>((_,reject)=>setTimeout(()=>reject(new Error(`${label} timeout after ${ms}ms`)),ms))]);
          }
          async function main(){
            const challenge=JSON.parse(readFileSync(directDiscoveryChallengePath(),'utf8')) as {challenge:string};
            const identityPublic=readFileSync(directIdentityPubPath(),'utf8');
            const identity=loadOrCreateHostIdentityKey();
            const keys=generateEphemeralKeyPair();
            const req=createBootstrapAuthRequest({agentId:'chatgpt-sol',hostId:hostIdentifier(),challenge:challenge.challenge,clientEphemeralPublicKey:keys.publicKeyPem,requestedCapabilities:[...DEFAULT_ALLOWED_CAPABILITIES]});
            console.log(`auth_request=${req.requestId}`);
            publish(req);
            let grant:any=null;
            for(let i=0;i<40;i++){grant=readStoredBootstrapGrant(req.requestId);if(grant)break;await sleep(500);}
            if(!grant) throw new Error('grant timeout');
            console.log(`grant=${grant.sessionId}`);
            console.log(`session_file=${existsSync(`/home/hesham/gova/.local/direct-agent/sessions/active/${grant.sessionId}.json`)}`);
            if(!verifySignedBootstrapGrant(grant,identityPublic)) throw new Error('grant signature invalid');
            const client=new DirectAgentClient();
            const hs=await withTimeout(client.connect({host:'127.0.0.1',port:resolveDirectAgentPort(),sessionId:grant.sessionId,bootstrapRequestId:grant.requestId,clientKeyPair:keys,bootstrapChallenge:challenge.challenge,serverEphemeralPublicKey:grant.serverEphemeralPublicKey,expectedHostId:hostIdentifier(),expectedServerKeyId:identity.serverKeyId,expectedServerIdentityPublicKey:identityPublic,rejectUnauthorized:false}),8000,'handshake');
            console.log(`handshake=${hs.status}`);
            const status=await withTimeout(client.status(),8000,'status');
            let stdout=''; let stderr='';
            const result=await withTimeout(client.exec("printf 'P2P_DIRECT_OK\\n'; hostname; pwd",{},c=>{if(c.stdout)stdout+=c.stdout;if(c.stderr)stderr+=c.stderr}),12000,'exec');
            console.log(JSON.stringify({connected:true,path:'tls:127.0.0.1:48732',stdout,stderr,exitCode:result.exitCode,workspace:(status as any).workspace},null,2));
            await client.close();
          }
          main().then(()=>process.exit(0)).catch(e=>{console.error(e instanceof Error?e.stack||e.message:String(e));process.exit(2)});
          TS
          set +e
          npx tsx /tmp/gova-direct-probe.ts
          code=$?
          set -e
          rm -f /tmp/gova-direct-probe.ts
          echo "probe_exit=$code"
          if [ "$code" -ne 0 ]; then
            echo '=== direct daemon journal ==='
            journalctl --user -u gova-direct-agent.service -n 100 --no-pager || true
            echo '=== session files ==='
            find /home/hesham/gova/.local/direct-agent/sessions -maxdepth 2 -type f -printf '%P\n' 2>/dev/null | tail -50 || true
            exit "$code"
          fi
