name: migrate-build-test-gates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-build-test-gates.yml

permissions:
  contents: write

concurrency:
  group: architecture-finalization
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Compact package Build/Test doors
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.scripts.build = 'npx tsx scripts/run-generated-gate.ts build';
          pkg.scripts['build:static'] = 'npx tsx scripts/run-generated-gate.ts build:static';
          pkg.scripts.test = 'npx tsx scripts/run-generated-gate.ts test';
          pkg.scripts['gates:verify'] = 'npx tsx scripts/generated-gate-contract.ts';
          delete pkg.scripts.pretest;
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Remove obsolete migration artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/architecture/finalize-feature-layers.mjs
          rm -f scripts/architecture/finalize-feature-contract.mjs
          rm -f scripts/architecture/fix-notification-layering.mjs
          rm -f .architecture-feature-verification-status
          rm -f .architecture-notification-reference-map
          rm -f .architecture-feature-*.log
          rm -f .architecture-feature-canonicalization-verified
          rm -f .architecture-finalization-status.md
          rm -f .github/workflows/finalize-feature-layers.yml

      - name: Run final verification matrix
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/asol-final
          failures=0
          run_check() {
            name="$1"
            shift
            echo "===== $name ====="
            "$@" >"/tmp/asol-final/${name}.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "FAILED: $name ($code)"
              tail -n 160 "/tmp/asol-final/${name}.log"
              failures=$((failures + 1))
            else
              echo "PASSED: $name"
              tail -n 20 "/tmp/asol-final/${name}.log"
            fi
          }
          run_check gates npm run gates:verify
          run_check services-sync npm run services:sync
          run_check architecture npm run architecture:check
          run_check typecheck npm run typecheck
          run_check lint npm run lint
          run_check tests npm test
          run_check services-verify npm run services:verify
          run_check services-build npm run services:build
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist diagnostics on failure
        if: steps.verify.outputs.failures != '0'
        shell: bash
        run: |
          set -euo pipefail
          failures='${{ steps.verify.outputs.failures }}'
          git reset --hard HEAD
          {
            echo '# Architecture finalization failed'
            echo
            echo "Failed checks: ${failures}"
            echo
            for log in /tmp/asol-final/*.log; do
              name=$(basename "$log" .log)
              echo "## ${name}"
              echo '```text'
              tail -n 160 "$log"
              echo '```'
              echo
            done
          } > .architecture-finalization-status.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .architecture-finalization-status.md
          git commit -m 'test(architecture): persist finalization diagnostics'
          git push origin HEAD:main
          exit 1

      - name: Commit verified clean architecture
        if: steps.verify.outputs.failures == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .architecture-finalization-status.md
          rm -f .github/workflows/migrate-build-test-gates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Expected finalization changes are missing.'; exit 1; }
          git commit -m 'refactor(architecture): finalize generated build and test gates'
          git push origin HEAD:main
