name: local-agent-bootstrap
on:
  workflow_dispatch:
  push:
    branches:
      - integration
    paths:
      - ".local-agent-main-promotion-trigger/**"
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 30
    steps:
      - name: Reconcile main into integration for Local Runner promotion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=/home/hesham/gova
          IW=/home/hesham/gova-agents/integration
          export PYTHONDONTWRITEBYTECODE=1

          BASIC=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -C "$REPO" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $BASIC" fetch --quiet origin main integration
          MAIN_BEFORE=$(git -C "$REPO" rev-parse origin/main)
          git -C "$IW" merge --abort 2>/dev/null || true
          git -C "$IW" checkout integration
          git -C "$IW" reset --hard origin/integration
          git -C "$IW" config user.name gova-local-agent
          git -C "$IW" config user.email gova-local-agent@users.noreply.github.com

          set +e
          git -C "$IW" merge --no-commit --no-ff origin/main
          MERGE_RC=$?
          set -e
          if [ "$MERGE_RC" -ne 0 ]; then
            mapfile -t CONFLICTS < <(git -C "$IW" diff --name-only --diff-filter=U)
            printf 'merge-conflicts:\n'
            printf ' - %s\n' "${CONFLICTS[@]}"
            for f in "${CONFLICTS[@]}"; do
              case "$f" in
                package.json)
                  git -C "$IW" checkout --theirs -- "$f"
                  python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/home/hesham/gova-agents/integration/package.json')
          data=json.loads(p.read_text())
          scripts=data.get('scripts',{})
          for key in list(scripts):
              if key.startswith('local-agent:'):
                  scripts.pop(key,None)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
                  git -C "$IW" add "$f"
                  ;;
                docs/09-agent-knowledge/generated/*|docs/01-architecture/08-reference/dependency-map.md)
                  git -C "$IW" checkout --ours -- "$f"
                  git -C "$IW" add "$f"
                  ;;
                *)
                  echo "unexpected merge conflict: $f" >&2
                  git -C "$IW" merge --abort
                  exit 2
                  ;;
              esac
            done
            test -z "$(git -C "$IW" diff --name-only --diff-filter=U)"
          fi

          rm -rf "$IW/.local-agent-main-promotion-trigger"
          cat > "$IW/.github/workflows/local-agent-bootstrap.yml" <<'YAML'
          name: local-agent-bootstrap
          on:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            bootstrap:
              runs-on: [self-hosted, Linux, X64, gova]
              timeout-minutes: 15
              steps:
                - name: Install persistent local-agent gateway
                  shell: bash
                  run: |
                    set -euo pipefail
                    git -C /home/hesham/gova fetch --quiet origin integration
                    mkdir -p /home/hesham/gova-agents
                    if [ ! -e /home/hesham/gova-agents/integration/.git ]; then
                      git -C /home/hesham/gova worktree add /home/hesham/gova-agents/integration integration
                    fi
                    git -C /home/hesham/gova-agents/integration checkout integration
                    git -C /home/hesham/gova-agents/integration reset --hard origin/integration
                    GOVA_AGENT_REPO=/home/hesham/gova-agents/integration bash /home/hesham/gova-agents/integration/tools/local-agent/install.sh
          YAML

          cd "$IW"
          npm run docs:generate
          npm run architecture:docs
          npm run github:ci-policy
          npm run architecture:check
          DOCS_CONTRACT_CHANGE=1 npm run docs:ci
          rm -rf /tmp/gova-local-agent-pyc
          PYTHONPYCACHEPREFIX=/tmp/gova-local-agent-pyc python3 -m py_compile tools/local-agent/*.py
          git add -A
          git commit -m 'merge(main): preserve current main while promoting Local Runner [docs-contract-change]'
          MERGED_SHA=$(git rev-parse HEAD)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $BASIC" push origin HEAD:integration
          git -C "$REPO" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $BASIC" fetch --quiet origin main integration
          MAIN_AFTER=$(git -C "$REPO" rev-parse origin/main)
          INTEGRATION_AFTER=$(git -C "$REPO" rev-parse origin/integration)
          test "$MAIN_BEFORE" = "$MAIN_AFTER"
          test "$MERGED_SHA" = "$INTEGRATION_AFTER"
          BRANCHES=$(git -C "$REPO" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $BASIC" ls-remote --heads origin | sed 's#.*refs/heads/##' | sort | tr '\n' ' ')
          test "$BRANCHES" = 'integration main '
          echo "RECONCILED_INTEGRATION=$INTEGRATION_AFTER"
          echo "MAIN_PRESERVED=$MAIN_AFTER"
          echo 'LOCAL_RUNNER_MAIN_RECONCILIATION=PASS'
