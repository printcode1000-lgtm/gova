name: local-agent-bootstrap
on:
  workflow_dispatch:
  push:
    branches:
      - integration
    paths:
      - ".local-agent-discovery-trigger/**"
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 30
    steps:
      - name: Real multi-agent monitor and Codex verification
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=/home/hesham/gova
          IW=/home/hesham/gova-agents/integration
          CODEX=/home/hesham/.codex/plugins/.plugin-appserver/codex
          export PYTHONDONTWRITEBYTECODE=1

          echo 'PHASE 1: sync integration and install current persistent runtime'
          git -C "$REPO" remote set-url origin https://github.com/printcode1000-lgtm/gova.git
          BASIC=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -C "$REPO" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $BASIC" fetch --quiet origin main integration
          unset BASIC
          mkdir -p /home/hesham/gova-agents
          if [ ! -e "$IW/.git" ]; then
            git -C "$REPO" worktree add "$IW" integration
          fi
          git -C "$IW" checkout integration
          git -C "$IW" reset --hard origin/integration
          bash "$IW/tools/local-agent/install.sh"
          /home/hesham/.local/bin/gova-agent health
          /home/hesham/.local/bin/gova-agent-monitor --once | head -n 120
          if pgrep -af 'scripts/local-agent-watch.ts' >/tmp/legacy-monitor-processes.txt; then
            cat /tmp/legacy-monitor-processes.txt
            echo 'legacy local-agent-watch process is still running' >&2
            exit 1
          fi
          grep -F 'Exec=/home/hesham/.local/bin/gova-agent-monitor' /home/hesham/.local/share/applications/gova-agent-monitor.desktop
          test -x "$CODEX"
          "$CODEX" login status
          MAIN_BEFORE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "main-before=$MAIN_BEFORE"

          echo 'PHASE 2: deterministic adversarial multi-agent simulation'
          python3 "$IW/tools/local-agent/selftest.py" --restart-service | tee /tmp/gova-local-agent-selftest.json
          git -C "$REPO" fetch --quiet origin integration
          git -C "$IW" reset --hard origin/integration
          bash "$IW/tools/local-agent/install.sh"

          echo 'PHASE 3: authenticated real Codex worker + concurrent reviewer + cloud monitor probe'
          python3 "$IW/tools/local-agent/codex_test.py" --codex-bin "$CODEX" --integrate-safe | tee /tmp/gova-local-agent-codex-test.json
          git -C "$REPO" fetch --quiet origin integration
          git -C "$IW" reset --hard origin/integration
          bash "$IW/tools/local-agent/install.sh"
          /home/hesham/.local/bin/gova-agent-monitor --once | head -n 160

          echo 'PHASE 4: launch persistent desktop monitor in the logged-in GNOME session when available'
          GNOME_PID=$(pgrep -u hesham -n gnome-shell || true)
          GUI_RESULT=no-session
          if [ -n "$GNOME_PID" ] && [ -r "/proc/$GNOME_PID/environ" ]; then
            GUI_ENV=$(tr '\0' '\n' < "/proc/$GNOME_PID/environ")
            DISPLAY_VALUE=$(printf '%s\n' "$GUI_ENV" | sed -n 's/^DISPLAY=//p' | head -n1)
            WAYLAND_VALUE=$(printf '%s\n' "$GUI_ENV" | sed -n 's/^WAYLAND_DISPLAY=//p' | head -n1)
            DBUS_VALUE=$(printf '%s\n' "$GUI_ENV" | sed -n 's/^DBUS_SESSION_BUS_ADDRESS=//p' | head -n1)
            if [ -n "$DBUS_VALUE" ]; then
              env -u RUNNER_TRACKING_ID DISPLAY="${DISPLAY_VALUE:-:0}" WAYLAND_DISPLAY="${WAYLAND_VALUE:-}" DBUS_SESSION_BUS_ADDRESS="$DBUS_VALUE" \
                nohup gnome-terminal --title='Gova Local Agent Monitor' -- /home/hesham/.local/bin/gova-agent-monitor \
                >/tmp/gova-agent-monitor-launch.log 2>&1 </dev/null &
              sleep 2
              if pgrep -u hesham -af 'gova-agent-monitor' | grep -v 'github-runners' >/tmp/gova-monitor-live.txt; then
                GUI_RESULT=launched
                cat /tmp/gova-monitor-live.txt
              else
                GUI_RESULT=launcher-sent
                cat /tmp/gova-agent-monitor-launch.log || true
              fi
            fi
          fi
          echo "gui-monitor=$GUI_RESULT"

          echo 'PHASE 5: restore final repository contract before policy checks'
          git -C "$IW" fetch --quiet origin integration
          git -C "$IW" reset --hard origin/integration
          rm -rf "$IW/.local-agent-discovery-trigger"
          cat > "$IW/.github/workflows/local-agent-bootstrap.yml" <<'YAML'
          name: local-agent-bootstrap
          on:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            bootstrap:
              runs-on: [self-hosted, Linux, X64, gova]
              timeout-minutes: 15
              steps:
                - name: Install persistent local-agent gateway
                  shell: bash
                  run: |
                    set -euo pipefail
                    git -C /home/hesham/gova remote set-url origin https://github.com/printcode1000-lgtm/gova.git
                    git -C /home/hesham/gova config --local --unset-all credential.helper 2>/dev/null || true
                    git -C /home/hesham/gova config --local credential.helper /home/hesham/.local/lib/gova-agent/git_credential.py
                    git -C /home/hesham/gova fetch --quiet origin integration
                    mkdir -p /home/hesham/gova-agents
                    if [ ! -e /home/hesham/gova-agents/integration/.git ]; then
                      git -C /home/hesham/gova worktree add /home/hesham/gova-agents/integration integration
                    fi
                    git -C /home/hesham/gova-agents/integration checkout integration
                    git -C /home/hesham/gova-agents/integration reset --hard origin/integration
                    bash /home/hesham/gova-agents/integration/tools/local-agent/install.sh
          YAML
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/hesham/gova-agents/integration/.gitignore')
          s=p.read_text()
          old='''# Local agent control plane runtime root. Holds the six GitHub Actions\n# self-hosted runner installs, their _work checkouts, agent worktrees, and the\n# coordination channel (locks, messages, agent registry, operation logs).\n# Binaries, runner credentials, workspaces, and runtime state never get\n# committed; only the scripts and workflows that drive them do.\n.local/\n'''
          new='''# Persistent local-agent runtime and generated Python caches. Runtime databases,\n# command logs, runner credentials and agent worktrees stay outside tracked source.\n.local/\n__pycache__/\n*.pyc\n'''
          if old in s:
              s=s.replace(old,new)
          else:
              if '__pycache__/' not in s:
                  s += '\n# Generated Python bytecode\n__pycache__/\n*.pyc\n'
          p.write_text(s)
          PY
          rm -rf "$IW/tools/local-agent/__pycache__"

          echo 'PHASE 6: regenerate protected docs and run repository guards'
          cd "$IW"
          npm run docs:generate
          npm run github:ci-policy
          npm run architecture:check
          DOCS_CONTRACT_CHANGE=1 npm run docs:ci
          python3 -m py_compile tools/local-agent/*.py
          python3 tools/local-agent/monitor.py --once >/tmp/gova-monitor-final.txt
          cat /tmp/gova-monitor-final.txt | head -n 120

          echo 'PHASE 7: commit and publish final clean integration state through GitHub API, never git push'
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='gova-local-agent' -c user.email='gova-local-agent@users.noreply.github.com' commit -m 'test(local-agent): finalize real Codex and monitor verification [docs-contract-change]'
          fi
          FINAL_LOCAL=$(git rev-parse HEAD)
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('/home/hesham/gova-agents/integration/tools/local-agent/gateway.py')
          spec=importlib.util.spec_from_file_location('gova_gateway_publish', path)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          print('published-integration='+mod.publish_worktree_branch_api(Path('/home/hesham/gova-agents/integration'),'integration'))
          PY
          git -C "$REPO" fetch --quiet origin main integration
          FINAL_REMOTE=$(git -C "$REPO" rev-parse origin/integration)
          MAIN_AFTER=$(git -C "$REPO" rev-parse origin/main)
          test "$FINAL_LOCAL" = "$FINAL_REMOTE"
          test "$MAIN_BEFORE" = "$MAIN_AFTER"
          BRANCHES=$(git -C "$REPO" ls-remote --heads origin | sed 's#.*refs/heads/##' | sort | tr '\n' ' ')
          test "$BRANCHES" = 'integration main '
          test ! -e "$IW/.local-agent-discovery-trigger"
          grep -q '^  workflow_dispatch:$' "$IW/.github/workflows/local-agent-bootstrap.yml"
          ! grep -q '^  push:$' "$IW/.github/workflows/local-agent-bootstrap.yml"
          echo "FINAL_INTEGRATION=$FINAL_REMOTE"
          echo "MAIN_UNCHANGED=$MAIN_AFTER"
          echo "REMOTE_BRANCHES=$BRANCHES"
          echo 'REAL_MULTI_AGENT_CODEX_MONITOR_VERIFICATION=PASS'
