name: local-agent-bootstrap
on:
  workflow_dispatch:
  push:
    branches:
      - integration
    paths:
      - ".agent-repair/run-multi-agent-sim-2.trigger"
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 15
    steps:
      - name: Run adversarial multi-agent simulation
        shell: bash
        run: |
          set -euo pipefail
          git -C /home/hesham/gova fetch --quiet origin integration
          mkdir -p /home/hesham/gova-agents
          if [ ! -e /home/hesham/gova-agents/integration/.git ]; then
            git -C /home/hesham/gova worktree add /home/hesham/gova-agents/integration integration
          fi
          git -C /home/hesham/gova-agents/integration checkout integration
          git -C /home/hesham/gova-agents/integration reset --hard origin/integration
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/hesham/gova-agents/integration/.agent-repair/multi-agent-sim.py')
          s=p.read_text()
          s=s.replace("doc.write_text(d.rstrip()+addition+'\\n')", "doc.write_text((d.rstrip()+addition).rstrip()+'\\n')")
          p.write_text(s)
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 /home/hesham/gova-agents/integration/.agent-repair/multi-agent-sim.py
