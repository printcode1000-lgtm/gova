name: local-agent-bootstrap
on:
  workflow_dispatch:
  push:
    branches:
      - integration
    paths:
      - ".github/workflows/local-agent-bootstrap.yml"
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 15
    steps:
      - name: Apply direct local editing contract on canonical checkout
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/hesham/gova
          test -d "$ROOT/.git"
          echo '=== BEFORE ==='
          git -C "$ROOT" status --short --branch

          python3 - <<'PY'
          from pathlib import Path

          root = Path('/home/hesham/gova')
          old = "The repository has exactly two recognized remote branches: `main` and `integration`. `main` is the production/release branch. `integration` is the persistent non-production aggregation branch for verified agent results. Every agent performs mutable task work in a dedicated local Git worktree and local `agent/<agent>/<task>` branch under `/home/hesham/gova-agents`; task branches are never pushed to GitHub. Normal commands, coordination, locks, checkpoints, handoffs, and result streaming use the persistent `gova-agent-gateway` service directly, not GitHub Actions. Completed verified work is submitted through the gateway to `integration`. Never create, push, request, or depend on any third remote branch. Promotion from `integration` to `main` is a separate deliberate release action."
          new = "The repository has exactly two recognized remote branches: `main` and `integration`. `main` is the production/release branch and `integration` is available only when the user explicitly requests integration/aggregation work. **Default local-agent execution is direct editing of the canonical checkout `/home/hesham/gova` in its current local branch and working tree.** A local agent must not automatically create a task worktree under `/home/hesham/gova-agents`, create an `agent/*` branch, register with or route commands through `gova-agent-gateway`, acquire gateway locks/checkpoints/handoffs, submit results to `integration`, commit, push, or deploy. Those mechanisms are opt-in and may be used only when the user explicitly requests gateway-managed isolation, integration, commit/push, or deployment. GitHub `workflow_dispatch` through `local-agent-bootstrap.yml` is the primary remote bootstrap/entry path to prepare or recover the local device; using bootstrap does not make the gateway the default execution path. Local agents must preserve existing local changes and edit the requested files directly. Never create, push, request, or depend on any third remote branch."

          instruction_files = [
              'AGENTS.md',
              'CLAUDE.md',
              'GEMINI.md',
              '.agents/rules/agent-instructions.md',
          ]
          for rel in instruction_files:
              p = root / rel
              text = p.read_text()
              if new in text:
                  print('already-updated', rel)
                  continue
              if old not in text:
                  raise SystemExit(f'expected repository model paragraph not found in {rel}')
              p.write_text(text.replace(old, new, 1))
              print('updated', rel)

          runtime = root / 'docs/09-agent-knowledge/local-agent-runtime.md'
          text = runtime.read_text()
          marker = '## Current Local-Agent Operating Policy (2026-09-04)'
          if marker not in text:
              insert = '''\n## Current Local-Agent Operating Policy (2026-09-04)\n\nThis section supersedes the older gateway-first migration notes below for normal local-agent work.\n\n- The default local workspace is the canonical checkout at `/home/hesham/gova`. Local agents edit requested files there directly.\n- Do not create per-task worktrees or `agent/*` branches unless the user explicitly requests isolated worktree execution.\n- Do not automatically register with, send commands through, or otherwise use `gova-agent-gateway`/localhost agent control. Gateway-managed execution is opt-in and requires an explicit user request.\n- Do not automatically submit completed work to `integration`, commit, push, or deploy. Each of those actions requires explicit user intent.\n- GitHub `workflow_dispatch` through `.github/workflows/local-agent-bootstrap.yml` is the primary remote bootstrap/entry path for preparing or recovering the local device. Bootstrap may install or restart gateway infrastructure, but that infrastructure is not the default execution path for local agents.\n- Existing local modifications in `/home/hesham/gova` must be preserved. A local agent must not reset, replace, or relocate them merely to obtain isolation.\n\nThe sections dated 2026-09-02 and 2026-09-03 below are retained as historical migration and verification records. Where they describe gateway-first normal execution, this current policy takes precedence.\n'''
              text = text.replace('# Persistent Local Agent Runtime\n', '# Persistent Local Agent Runtime\n' + insert, 1)
              runtime.write_text(text)
              print('updated docs/09-agent-knowledge/local-agent-runtime.md')

          tunnel = root / 'docs/09-agent-knowledge/public-agent-tunnel.md'
          text = tunnel.read_text()
          marker = '## Local-Agent Execution Boundary'
          if marker not in text:
              insert = '''\n## Local-Agent Execution Boundary\n\nThis tunnel is infrastructure for explicitly requested gateway-controlled access. It does not make the gateway the default execution path for local agents. Normal local-agent work edits `/home/hesham/gova` directly and must not use the localhost gateway, create agent worktrees, or submit to `integration` unless the user explicitly requests that mode. GitHub bootstrap remains the primary remote entry/recovery path.\n'''
              text = text.replace('# Gova Local Agent Public Tunnel\n', '# Gova Local Agent Public Tunnel\n' + insert, 1)
              tunnel.write_text(text)
              print('updated docs/09-agent-knowledge/public-agent-tunnel.md')
          PY

          echo '=== OLD AUTOMATIC MODEL REFERENCES ==='
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules \
            -e 'Every agent performs mutable task work in a dedicated local Git worktree' \
            -e 'Completed verified work is submitted through the gateway to `integration`' \
            "$ROOT/AGENTS.md" "$ROOT/CLAUDE.md" "$ROOT/GEMINI.md" "$ROOT/.agents" "$ROOT/docs/09-agent-knowledge" || true

          echo '=== VERIFY CONTRACT TEXT ==='
          grep -n 'Default local-agent execution is direct editing' "$ROOT/AGENTS.md"
          grep -n 'Current Local-Agent Operating Policy' "$ROOT/docs/09-agent-knowledge/local-agent-runtime.md"
          grep -n 'Local-Agent Execution Boundary' "$ROOT/docs/09-agent-knowledge/public-agent-tunnel.md"

          echo '=== CHECK NO AUTOMATIC GATEWAY CALLS IN AGENT INSTRUCTIONS ==='
          if grep -RIn --exclude-dir=.git \
            -e '/v1/workspace/create' \
            -e '/v1/agent/register' \
            -e 'integration-submit' \
            "$ROOT/AGENTS.md" "$ROOT/CLAUDE.md" "$ROOT/GEMINI.md" "$ROOT/.agents/rules"; then
            echo 'unexpected automatic gateway instruction found' >&2
            exit 1
          fi

          echo '=== MUTABILITY CHECK ==='
          cd "$ROOT"
          DOCS_CONTRACT_CHANGE=1 npm run docs:mutability:check

          echo '=== AFTER ==='
          git status --short --branch
          echo DIRECT_LOCAL_EDITING_CONTRACT=PASS
