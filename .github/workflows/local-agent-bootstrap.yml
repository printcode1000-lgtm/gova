name: local-agent-bootstrap
on:
  workflow_dispatch:
  push:
    branches:
      - integration
    paths:
      - ".local-agent-discovery-trigger/**"
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 30
    steps:
      - name: Validate complete local-agent recovery bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOVA_LOCAL_DISPATCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=/home/hesham/gova
          IW=/home/hesham/gova-agents/integration
          TAG="recovery-${GITHUB_RUN_ID}"
          PROBE="/home/hesham/gova-agents/${TAG}"
          BRANCH="agent/recovery-probe/${GITHUB_RUN_ID}"
          ARCHIVE="/tmp/gova-agent-recovery-${GITHUB_RUN_ID}.tar.gz"
          RESTORE="/tmp/gova-agent-restore-${GITHUB_RUN_ID}"
          export PYTHONDONTWRITEBYTECODE=1

          BASIC=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -C "$REPO" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $BASIC" fetch --quiet origin main integration
          unset BASIC
          git -C "$IW" checkout integration
          git -C "$IW" reset --hard origin/integration
          MAIN_BEFORE=$(git -C "$REPO" ls-remote origin refs/heads/main | awk '{print $1}')

          rm -rf "$PROBE" "$RESTORE" "$ARCHIVE"
          git -C "$REPO" worktree remove --force "$PROBE" 2>/dev/null || true
          git -C "$REPO" branch -D "$BRANCH" 2>/dev/null || true
          git -C "$REPO" worktree add -b "$BRANCH" "$PROBE" origin/integration
          printf '\n# RECOVERY_STAGED_%s\n' "$GITHUB_RUN_ID" >> "$PROBE/tools/local-agent/monitor.py"
          git -C "$PROBE" add tools/local-agent/monitor.py
          printf '# RECOVERY_UNSTAGED_%s\n' "$GITHUB_RUN_ID" >> "$PROBE/tools/local-agent/monitor.py"
          printf 'safe untracked %s\n' "$GITHUB_RUN_ID" > "$PROBE/recovery-probe.txt"
          printf 'must-not-be-backed-up\n' > "$PROBE/test-token.txt"

          GOVA_AGENT_REPO="$IW" bash "$IW/tools/local-agent/install.sh"
          export GOVA_AGENT_REPO="$REPO"
          /home/hesham/.local/bin/gova-agent recovery create "$ARCHIVE"
          /home/hesham/.local/bin/gova-agent recovery verify "$ARCHIVE"
          /home/hesham/.local/bin/gova-agent recovery restore "$ARCHIVE" "$RESTORE"

          test -s "$RESTORE/runtime/runtime.sqlite3"
          python3 - <<PY
          import sqlite3
          c=sqlite3.connect('$RESTORE/runtime/runtime.sqlite3')
          assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          c.close()
          PY
          test -f "$RESTORE/repo/tools/local-agent/gateway.py"
          test -f "$RESTORE/repo/tools/local-agent/cli.py"
          test -f "$RESTORE/repo/tools/local-agent/monitor.py"
          test -f "$RESTORE/repo/tools/local-agent/recovery.py"
          test -f "$RESTORE/repo/tools/local-agent/install.sh"
          test -f "$RESTORE/repo/tools/local-agent/gova-agent-gateway.service"
          test -f "$RESTORE/repo/tools/local-agent/selftest.py"
          test -f "$RESTORE/repo/tools/local-agent/codex_test.py"
          test -f "$RESTORE/repo/.github/workflows/local-agent-bootstrap.yml"
          test -f "$RESTORE/repo/docs/06-super-admin-and-operations/local-agent-recovery.md"

          RECOVERED_PROBE=$(find "$RESTORE/worktrees" -mindepth 1 -maxdepth 1 -type d -name "*agent_recovery-probe_${GITHUB_RUN_ID}" | head -n1)
          test -n "$RECOVERED_PROBE"
          grep -q "RECOVERY_STAGED_${GITHUB_RUN_ID}" "$RECOVERED_PROBE/tools/local-agent/monitor.py"
          grep -q "RECOVERY_UNSTAGED_${GITHUB_RUN_ID}" "$RECOVERED_PROBE/tools/local-agent/monitor.py"
          test -f "$RECOVERED_PROBE/recovery-probe.txt"
          test ! -e "$RECOVERED_PROBE/test-token.txt"
          git -C "$RECOVERED_PROBE" diff --cached -- tools/local-agent/monitor.py | grep -q "RECOVERY_STAGED_${GITHUB_RUN_ID}"
          git -C "$RECOVERED_PROBE" diff -- tools/local-agent/monitor.py | grep -q "RECOVERY_UNSTAGED_${GITHUB_RUN_ID}"
          grep -q 'test-token.txt' "$RESTORE/manifest.json"

          git -C "$REPO" worktree remove --force "$PROBE"
          git -C "$REPO" branch -D "$BRANCH"
          rm -rf "$RESTORE" "$ARCHIVE"

          # Final repository state: bootstrap returns to manual-only and the
          # temporary trigger is removed before the final integration commit.
          git -C "$IW" fetch --quiet origin integration
          git -C "$IW" reset --hard origin/integration
          rm -rf "$IW/.local-agent-discovery-trigger"
          cat > "$IW/.github/workflows/local-agent-bootstrap.yml" <<'YAML'
          name: local-agent-bootstrap
          on:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            bootstrap:
              runs-on: [self-hosted, Linux, X64, gova]
              timeout-minutes: 15
              steps:
                - name: Install persistent local-agent gateway
                  shell: bash
                  run: |
                    set -euo pipefail
                    git -C /home/hesham/gova fetch --quiet origin integration
                    mkdir -p /home/hesham/gova-agents
                    if [ ! -e /home/hesham/gova-agents/integration/.git ]; then
                      git -C /home/hesham/gova worktree add /home/hesham/gova-agents/integration integration
                    fi
                    git -C /home/hesham/gova-agents/integration checkout integration
                    git -C /home/hesham/gova-agents/integration reset --hard origin/integration
                    GOVA_AGENT_REPO=/home/hesham/gova-agents/integration bash /home/hesham/gova-agents/integration/tools/local-agent/install.sh
          YAML

          cd "$IW"
          npm run docs:generate
          npm run github:ci-policy
          npm run architecture:check
          DOCS_CONTRACT_CHANGE=1 npm run docs:ci
          python3 -m py_compile tools/local-agent/*.py
          GOVA_AGENT_REPO="$IW" bash tools/local-agent/install.sh
          /home/hesham/.local/bin/gova-agent health >/tmp/gova-recovery-health.json
          /home/hesham/.local/bin/gova-agent-monitor --once >/tmp/gova-recovery-monitor.txt

          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='gova-local-agent' -c user.email='gova-local-agent@users.noreply.github.com' commit -m 'feat(local-agent): finalize tested disaster recovery [docs-contract-change]'
          fi
          FINAL_LOCAL=$(git rev-parse HEAD)
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('/home/hesham/gova-agents/integration/tools/local-agent/gateway.py')
          spec=importlib.util.spec_from_file_location('gova_gateway_publish',path)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          print('published-integration='+mod.publish_worktree_branch_api(Path('/home/hesham/gova-agents/integration'),'integration'))
          PY
          git -C "$REPO" fetch --quiet origin main integration
          FINAL_REMOTE=$(git -C "$REPO" rev-parse origin/integration)
          MAIN_AFTER=$(git -C "$REPO" rev-parse origin/main)
          test "$FINAL_LOCAL" = "$FINAL_REMOTE"
          test "$MAIN_BEFORE" = "$MAIN_AFTER"
          BRANCHES=$(git -C "$REPO" ls-remote --heads origin | sed 's#.*refs/heads/##' | sort | tr '\n' ' ')
          test "$BRANCHES" = 'integration main '
          test ! -e "$IW/.local-agent-discovery-trigger"
          grep -q '^  workflow_dispatch:$' "$IW/.github/workflows/local-agent-bootstrap.yml"
          ! grep -q '^  push:$' "$IW/.github/workflows/local-agent-bootstrap.yml"
          echo "RECOVERY_VALIDATION=PASS"
          echo "FINAL_INTEGRATION=$FINAL_REMOTE"
          echo "MAIN_UNCHANGED=$MAIN_AFTER"
          echo "REMOTE_BRANCHES=$BRANCHES"
