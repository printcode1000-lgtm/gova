name: local-agent-bootstrap
on:
  workflow_dispatch:
  push:
    branches:
      - integration
    paths:
      - ".local-agent-discovery-trigger/**"
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Inspect installed Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          CODEX=/home/hesham/.codex/plugins/.plugin-appserver/codex
          test -x "$CODEX"
          "$CODEX" --version || true
          echo '=== top help ==='
          "$CODEX" --help 2>&1 | head -n 180
          echo '=== exec help ==='
          "$CODEX" exec --help 2>&1 | head -n 220 || true
          echo '=== login help/status ==='
          "$CODEX" login --help 2>&1 | head -n 120 || true
          "$CODEX" login status 2>&1 | head -n 60 || true
