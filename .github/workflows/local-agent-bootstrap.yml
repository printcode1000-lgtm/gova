name: local-agent-bootstrap
on:
  workflow_dispatch:
  push:
    branches:
      - integration
    paths:
      - ".local-agent-local-tree-trigger/**"
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 45
    steps:
      - name: Build complete Local Runner worktree locally
        shell: bash
        run: |
          set -euo pipefail
          REPO=/home/hesham/gova
          TREE=/home/hesham/gova-agents/local-runner-complete
          BRANCH=local/local-runner-complete
          EXPECTED_MAIN=4ddc6b9ade9038ca8669a72ebdf4e1b341f852f7
          REPORT=/home/hesham/.local/state/gova-agent-bootstrap/local-runner-tree-report.json
          export PYTHONDONTWRITEBYTECODE=1

          git -C "$REPO" fetch --quiet origin main integration
          test "$(git -C "$REPO" rev-parse origin/main)" = "$EXPECTED_MAIN"

          git -C "$REPO" worktree remove --force "$TREE" 2>/dev/null || true
          git -C "$REPO" branch -D "$BRANCH" 2>/dev/null || true
          git -C "$REPO" worktree add -b "$BRANCH" "$TREE" "$EXPECTED_MAIN"
          test "$(git -C "$TREE" rev-parse HEAD)" = "$EXPECTED_MAIN"
          git -C "$TREE" config user.name gova-local-agent
          git -C "$TREE" config user.email gova-local-agent@users.noreply.github.com
          if [ -d "$REPO/node_modules" ] && [ ! -e "$TREE/node_modules" ]; then
            ln -s "$REPO/node_modules" "$TREE/node_modules"
          fi

          set +e
          git -C "$TREE" merge --no-commit --no-ff origin/integration
          MERGE_RC=$?
          set -e
          if [ "$MERGE_RC" -ne 0 ]; then
            mapfile -t CONFLICTS < <(git -C "$TREE" diff --name-only --diff-filter=U)
            printf 'merge-conflicts:\n'
            printf ' - %s\n' "${CONFLICTS[@]}"
            for f in "${CONFLICTS[@]}"; do
              case "$f" in
                package.json)
                  git -C "$TREE" checkout --ours -- "$f"
                  python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/home/hesham/gova-agents/local-runner-complete/package.json')
          data=json.loads(p.read_text())
          scripts=data.get('scripts',{})
          for key in list(scripts):
              if key.startswith('local-agent:'):
                  scripts.pop(key,None)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
                  git -C "$TREE" add "$f"
                  ;;
                docs/09-agent-knowledge/generated/*|docs/01-architecture/08-reference/*)
                  git -C "$TREE" checkout --ours -- "$f"
                  git -C "$TREE" add "$f"
                  ;;
                *)
                  echo "unexpected merge conflict: $f" >&2
                  exit 2
                  ;;
              esac
            done
            test -z "$(git -C "$TREE" diff --name-only --diff-filter=U)"
          fi

          rm -rf "$TREE/.local-agent-main-promotion-trigger" "$TREE/.local-agent-main-selective-trigger" "$TREE/.local-agent-local-tree-trigger" "$TREE/.local-agent-discovery-trigger"
          rm -rf "$TREE/tools/local-agent/__pycache__"
          cat > "$TREE/.github/workflows/local-agent-bootstrap.yml" <<'YAML'
          name: local-agent-bootstrap
          on:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            bootstrap:
              runs-on: [self-hosted, Linux, X64, gova]
              timeout-minutes: 15
              steps:
                - name: Install persistent local-agent gateway
                  shell: bash
                  run: |
                    set -euo pipefail
                    git -C /home/hesham/gova fetch --quiet origin integration
                    mkdir -p /home/hesham/gova-agents
                    if [ ! -e /home/hesham/gova-agents/integration/.git ]; then
                      git -C /home/hesham/gova worktree add /home/hesham/gova-agents/integration integration
                    fi
                    git -C /home/hesham/gova-agents/integration checkout integration
                    git -C /home/hesham/gova-agents/integration reset --hard origin/integration
                    GOVA_AGENT_REPO=/home/hesham/gova-agents/integration bash /home/hesham/gova-agents/integration/tools/local-agent/install.sh
          YAML

          cd "$TREE"
          npm run docs:generate
          npm run architecture:docs
          npm run github:ci-policy
          npm run architecture:check
          DOCS_CONTRACT_CHANGE=1 npm run docs:ci
          rm -rf /tmp/gova-local-agent-tree-pyc
          PYTHONPYCACHEPREFIX=/tmp/gova-local-agent-tree-pyc python3 -m py_compile tools/local-agent/*.py

          GOVA_AGENT_REPO="$TREE" bash tools/local-agent/install.sh
          /home/hesham/.local/bin/gova-agent health >/tmp/gova-local-runner-tree-health.json
          /home/hesham/.local/bin/gova-agent diagnostics >/tmp/gova-local-runner-tree-diagnostics.json
          /home/hesham/.local/bin/gova-agent-monitor --once >/tmp/gova-local-runner-tree-monitor.txt

          git add -A
          git commit -m 'local(local-runner): consolidate complete conversation development [docs-contract-change]'
          FINAL=$(git rev-parse HEAD)
          test -z "$(git status --porcelain)"
          test "$(git -C "$REPO" rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(git -C "$REPO" ls-remote --heads origin "refs/heads/$BRANCH")"

          mkdir -p "$(dirname "$REPORT")"
          python3 - <<PY
          import json, subprocess
          tree='$TREE'; base='$EXPECTED_MAIN'; final='$FINAL'; branch='$BRANCH'
          def run(*a): return subprocess.check_output(a,text=True).strip()
          changed=run('git','-C',tree,'diff','--name-only',base+'..'+final).splitlines()
          payload={
            'ok': True,
            'path': tree,
            'branch': branch,
            'base_main_sha': base,
            'local_head_sha': final,
            'remote_main_unchanged': True,
            'remote_branch_created': False,
            'changed_files': len(changed),
            'tests': {
              'docs_generate':'pass','architecture_docs':'pass','github_ci_policy':'pass',
              'architecture_check':'pass','docs_ci':'pass','python_compile':'pass',
              'gateway_health':'pass','gateway_diagnostics':'pass','monitor_once':'pass'
            }
          }
          open('$REPORT','w').write(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY
          echo 'LOCAL_RUNNER_COMPLETE_TREE=PASS'
