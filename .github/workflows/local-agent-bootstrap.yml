name: local-agent-bootstrap
on:
  workflow_dispatch:
  push:
    branches:
      - integration
    paths:
      - ".local-agent-discovery-trigger/**"
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 10
    steps:
      - name: Discover local Codex and monitor
        shell: bash
        run: |
          set -euo pipefail
          echo '=== machine/session ==='
          echo "USER=$(id -un) UID=$(id -u)"
          printf 'DISPLAY=%s\nWAYLAND_DISPLAY=%s\nXDG_SESSION_TYPE=%s\nXDG_CURRENT_DESKTOP=%s\n' "${DISPLAY:-}" "${WAYLAND_DISPLAY:-}" "${XDG_SESSION_TYPE:-}" "${XDG_CURRENT_DESKTOP:-}"
          echo '=== codex ==='
          command -v codex || true
          codex --version || true
          codex --help 2>&1 | head -n 120 || true
          echo '=== terminals ==='
          for x in gnome-terminal x-terminal-emulator konsole xfce4-terminal xterm; do command -v "$x" || true; done
          echo '=== monitor candidates: processes ==='
          ps -ef | grep -Ei 'local.agent|agent.monitor|gova.agent|monitor' | grep -v grep || true
          echo '=== monitor candidates: local files ==='
          find /home/hesham/.local/bin /home/hesham/.local/share /home/hesham/gova -maxdepth 4 -type f \( -iname '*agent*monitor*' -o -iname '*local*agent*' \) -print 2>/dev/null | head -n 200 || true
          echo '=== local-agent installed commands ==='
          ls -la /home/hesham/.local/bin 2>/dev/null | grep -Ei 'gova|agent|monitor|codex' || true
