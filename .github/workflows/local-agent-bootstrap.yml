name: local-agent-bootstrap
on:
  workflow_dispatch:
  push:
    branches: [integration]
    paths: [".github/workflows/local-agent-bootstrap.yml"]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 15
    steps:
      - name: Continue deep read-only verification
        shell: bash
        run: |
          set -u
          ROOT=/home/hesham/gova
          echo '=== PROJECT HOOK/SETTINGS FILES ==='
          find "$ROOT/.claude" "$ROOT/.agents" -maxdepth 4 -type f \( -name '*.json' -o -name '*.jsonc' -o -name '*.toml' -o -name '*.yaml' -o -name '*.yml' -o -name '*.sh' \) -print 2>/dev/null | sort
          echo
          echo '=== PROJECT HOOK-LIKE ROUTING REFERENCES ==='
          grep -RInE --binary-files=without-match --exclude-dir=.git --exclude-dir=node_modules \
            '(hook|startup|sessionstart|pretooluse|posttooluse|127\.0\.0\.1:8765|localhost:8765|gova-agent|gateway|gova-agents|integration-submit|workspace-create)' \
            "$ROOT/.claude" "$ROOT/.agents" 2>/dev/null | head -400 || true
          echo
          echo '=== HOME AGENT CONFIG ROUTING REFERENCES ==='
          for d in /home/hesham/.claude /home/hesham/.codex; do
            [ -e "$d" ] || continue
            echo "--- $d"
            grep -RInE --binary-files=without-match --exclude='*.log' --exclude='*.sqlite*' --exclude='history*' --exclude-dir=node_modules --exclude-dir=cache --exclude-dir=Cache --exclude-dir=sessions --exclude-dir=tmp \
              '(127\.0\.0\.1:8765|localhost:8765|/v1/agent/register|/v1/workspace/create|/v1/integration/submit|gova-agent-gateway|/home/hesham/gova-agents|integration-submit|workspace-create)' "$d" 2>/dev/null | head -300 || true
          done
          echo
          echo '=== HOME SYSTEMD USER UNITS REFERENCING GOVA AGENT ==='
          grep -RInE --binary-files=without-match '(gova-agent|gova-agents|8765)' /home/hesham/.config/systemd/user 2>/dev/null || true
          echo
          echo '=== SHELL STARTUP AUTO-CALL SEARCH ==='
          for f in /home/hesham/.bashrc /home/hesham/.profile /home/hesham/.bash_profile /home/hesham/.zshrc; do
            [ -f "$f" ] || continue
            echo "--- $f"
            grep -nE '(gova-agent|gova-agents|8765|integration-submit|workspace-create)' "$f" || true
          done
          echo
          echo '=== RUNNING LOCAL-AGENT INFRASTRUCTURE ==='
          printf 'gateway-user='; systemctl --user is-active gova-agent-gateway.service 2>/dev/null || true
          printf 'public-user='; systemctl --user is-active gova-agent-public.service 2>/dev/null || true
          printf 'monitor-user='; systemctl --user is-active gova-agent-monitor-web.service 2>/dev/null || true
          printf 'gateway-system='; systemctl is-active gova-agent-gateway.service 2>/dev/null || true
          ps -eo pid,ppid,cmd | grep -E 'gova-agent|gateway.py|codex.*gova-agent' | grep -v grep || true
          echo
          echo '=== WORKTREES ==='
          git -C "$ROOT" worktree list --porcelain
          echo '=== AGENT BRANCHES ==='
          git -C "$ROOT" for-each-ref --format='%(refname:short)' refs/heads/agent/
          echo
          echo '=== RUNTIME COUNTS ==='
          python3 - <<'PY'
          from pathlib import Path
          import sqlite3
          p=Path('/home/hesham/.local/share/gova-agent-runtime/runtime.sqlite3')
          if not p.exists(): print('RUNTIME_DB=absent')
          else:
            c=sqlite3.connect(p)
            tabs=('agents','sessions','tasks','commands','locks','messages','handoffs','events')
            out={}
            for t in tabs:
              try: out[t]=c.execute(f'select count(*) from {t}').fetchone()[0]
              except Exception as e: out[t]='n/a'
            c.close(); print('RUNTIME_COUNTS='+repr(out))
          PY
          echo
          echo '=== CI POLICY LOCAL-AGENT SECTION ==='
          grep -nC 8 -E '(Local agent bootstrap|gova-agents/integration|local-agent-bootstrap)' "$ROOT/scripts/github-ci-policy.ts" || true
          echo
          echo '=== BOOTSTRAP LOCAL FILE ==='
          cat "$ROOT/.github/workflows/local-agent-bootstrap.yml"
          echo
          echo '=== CURRENT LOCAL MODIFICATIONS ==='
          git -C "$ROOT" status --short --branch
          echo '=== UNCOMMITTED CONTRACT FILES ==='
          git -C "$ROOT" diff --name-only -- AGENTS.md CLAUDE.md GEMINI.md .agents/rules/agent-instructions.md docs/09-agent-knowledge/local-agent-runtime.md docs/09-agent-knowledge/public-agent-tunnel.md
          echo CONTINUED_DEEP_VERIFY=COMPLETE
