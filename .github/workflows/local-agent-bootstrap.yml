name: local-agent-bootstrap
on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Gateway-managed execution mode
        required: true
        type: choice
        options:
          - A
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 15
    steps:
      - name: Bootstrap local-agent infrastructure from canonical checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.execution_mode }}" = A
          test -d /home/hesham/gova/.git
          GOVA_AGENT_REPO=/home/hesham/gova bash /home/hesham/gova/tools/local-agent/install.sh
