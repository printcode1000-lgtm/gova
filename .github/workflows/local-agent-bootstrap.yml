name: local-agent-bootstrap
on:
  workflow_dispatch:
  push:
    branches: [integration]
    paths:
      - ".agent-bootstrap/finalize.signal"
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 55
    steps:
      - name: Finalize persistent local-agent runtime
        shell: bash
        run: |
          set -euo pipefail
          git -C /home/hesham/gova fetch --quiet origin integration
          mkdir -p /home/hesham/gova-agents
          if [ ! -e /home/hesham/gova-agents/integration/.git ]; then
            git -C /home/hesham/gova worktree add /home/hesham/gova-agents/integration integration
          fi
          git -C /home/hesham/gova-agents/integration checkout integration
          git -C /home/hesham/gova-agents/integration reset --hard origin/integration
          python3 /home/hesham/gova-agents/integration/.agent-bootstrap/fix-finalizer.py
          python3 /home/hesham/gova-agents/integration/.agent-bootstrap/fix-encoding.py
          python3 /home/hesham/gova-agents/integration/.agent-bootstrap/fix-docs-auth.py
          python3 /home/hesham/gova-agents/integration/.agent-bootstrap/fix-legacy-sources.py
          python3 /home/hesham/gova-agents/integration/.agent-bootstrap/finalize-runtime.py
