name: local-agent-bootstrap
on:
  workflow_dispatch:
  push:
    branches: [integration]
    paths: [".github/workflows/local-agent-bootstrap.yml"]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, gova]
    timeout-minutes: 15
    steps:
      - name: Repair and deeply verify direct local editing contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/hesham/gova
          cd "$ROOT"
          echo '=== CONTEXT PACK ==='
          npx tsx scripts/docs/context.ts local-agent > /tmp/gova-direct-edit-context.txt
          sed -n '1,180p' /tmp/gova-direct-edit-context.txt

          echo '=== APPLY CONSISTENCY REPAIR DIRECTLY TO CANONICAL CHECKOUT ==='
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/home/hesham/gova')

          # 1) Permanent bootstrap: manual only, canonical checkout, no integration worktree.
          bootstrap=root/'.github/workflows/local-agent-bootstrap.yml'
          bootstrap.write_text('''name: local-agent-bootstrap
          on:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            bootstrap:
              runs-on: [self-hosted, Linux, X64, gova]
              timeout-minutes: 15
              steps:
                - name: Bootstrap local-agent infrastructure from canonical checkout
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -d /home/hesham/gova/.git
                    GOVA_AGENT_REPO=/home/hesham/gova bash /home/hesham/gova/tools/local-agent/install.sh
          '''.replace('          ',''))

          # 2) CI policy must enforce canonical bootstrap and forbid integration-worktree bootstrap.
          p=root/'scripts/github-ci-policy.ts'
          s=p.read_text()
          old='''  if (!body.includes("/home/hesham/gova-agents/integration") || !body.includes("tools/local-agent/install.sh")) errors.push("Local agent bootstrap must install from the integration worktree.");'''
          new='''  if (!body.includes("GOVA_AGENT_REPO=/home/hesham/gova") || !body.includes("/home/hesham/gova/tools/local-agent/install.sh")) errors.push("Local agent bootstrap must install from the canonical checkout `/home/hesham/gova`.");
            if (body.includes("/home/hesham/gova-agents/integration") || /git\\s+-C\\s+\\/home\\/hesham\\/gova\\s+worktree\\s+add/.test(body)) errors.push("Local agent bootstrap must not create or use the integration worktree.");'''
          if old not in s and new not in s:
              raise SystemExit('github-ci-policy expected old bootstrap invariant not found')
          s=s.replace(old,new,1)
          s=s.replace(''' * in `/home/hesham/gova`, reach the coordination channel there, and never
           * re-materialise the workspace it already has.''',''' * in `/home/hesham/gova`, use that canonical checkout as the bootstrap source,
           * and never re-materialise or route normal work through an integration worktree.''')
          p.write_text(s)

          # 3) Operational runtime doc: default direct editing; managed gateway mode is explicit opt-in.
          p=root/'docs/06-super-admin-and-operations/local-agent-runtime.md'
          s=p.read_text()
          s=s.replace('''The Local Runner is a persistent multi-agent execution environment. GitHub Actions is bootstrap/release infrastructure, not the normal command transport.''','''The canonical checkout at `/home/hesham/gova` is the default local-agent execution environment. GitHub `workflow_dispatch` through `local-agent-bootstrap.yml` is the primary remote bootstrap/entry path. Once an agent is operating locally, it edits the canonical checkout directly. The persistent Gateway remains available only as an explicitly requested managed/isolation mode.''')
          s=s.replace('''GitHub contains exactly two branches: `main` and `integration`. Agent branches such as `agent/<agent>/<task>` are local-only and must never be pushed. Normal agent completion integrates into `integration`; promotion from `integration` to `main` is a separate deliberate release operation. Local-agent runtime tests and normal agent submissions must not write `main`.''','''GitHub contains exactly two recognized remote branches: `main` and `integration`. `main` is the production/release branch and the canonical local checkout normally stays on its current branch while agents edit files directly. `integration` is used only when the user explicitly requests aggregation/integration work. Normal local-agent completion does not create an `agent/*` branch, does not move work to `integration`, and does not commit, push, or deploy unless the user explicitly requests those actions.''')
          s=s.replace('''- Canonical checkout: `/home/hesham/gova`
          - Agent worktrees: `/home/hesham/gova-agents/<agent>/<task>`
          - Integration worktree: `/home/hesham/gova-agents/integration`
          - Runtime state: `/home/hesham/.local/share/gova-agent-runtime`
          - Runtime database: `runtime.sqlite3` using SQLite WAL
          - Command output: `commands/`
          - Local client: `/home/hesham/.local/bin/gova-agent`
          - Local monitor: `/home/hesham/.local/bin/gova-agent-monitor`''','''- Default working checkout: `/home/hesham/gova`
          - Optional managed worktree root: `/home/hesham/gova-agents/` (created/used only when explicitly requested)
          - Optional Gateway runtime state: `/home/hesham/.local/share/gova-agent-runtime`
          - Optional Gateway database: `runtime.sqlite3` using SQLite WAL
          - Optional local client: `/home/hesham/.local/bin/gova-agent`
          - Read-only local monitor: `/home/hesham/.local/bin/gova-agent-monitor`''')
          s=s.replace('''## Gateway

          `gova-agent-gateway.service` runs continuously under systemd, restarts automatically, and listens on TCP port `8765`. `/health` is public; all mutation/state APIs require the local gateway key stored outside Git in `/home/hesham/.config/gova-agent/auth`.

          The service uses HTTP/JSON because it has very low startup/runtime overhead, works over LAN/Tailscale/private tunnels, and does not require GitHub jobs. Commands run in independent process groups; stdout/stderr are written directly to runtime files, so client disconnects do not terminate work.

          ## Agent lifecycle

          1. Register an agent.
          2. Create or resume a task.
          3. Create a task worktree from the current `origin/integration` baseline.
          4. Acquire narrow path/module locks only when needed.
          5. Execute commands directly through the gateway.
          6. Checkpoint meaningful state.
          7. Commit on the local agent branch.
          8. Submit the commit to local integration.
          9. The integration path cherry-picks, verifies, and publishes only `integration`.

          Agents are peers. Handoff state is stored in SQLite, not model memory.''','''## Default local-agent lifecycle

          1. Work in `/home/hesham/gova` on its current local branch and working tree.
          2. Preserve every pre-existing local modification; never reset or relocate it merely to obtain isolation.
          3. Read the required project context and modify the requested files directly.
          4. Run the smallest relevant non-browser verification locally.
          5. Stop with the verified changes still local unless the user explicitly asks for commit, push, integration, or deployment.

          This default lifecycle does **not** register an agent with localhost control, create a task/worktree, create an `agent/*` branch, acquire Gateway locks, or submit anything to `integration`.

          ## Optional Gateway-managed isolation mode

          `gova-agent-gateway.service` may remain installed and running under systemd. Its presence does not select it as the execution path. Use Gateway registration, task state, locks, worktrees, handoffs, or `integration-submit` only when the user explicitly requests managed/isolation mode.

          In that explicit mode, the Gateway listens on TCP port `8765`; `/health` is public and mutation/state APIs require the local key stored outside Git in `/home/hesham/.config/gova-agent/auth`. Worktrees under `/home/hesham/gova-agents/` and `integration-submit` are optional capabilities of this mode, not steps in normal local-agent work.''')
          s=s.replace('''## CLI examples''','''## Optional Gateway CLI examples''')
          s=s.replace('''## Locks and recovery

          Locks are scoped by kind and name/path and carry leases.''','''## Optional managed-mode locks and recovery

          The following behavior applies only when Gateway-managed mode was explicitly requested. Locks are scoped by kind and name/path and carry leases.''')
          s=s.replace('''The integration lock serializes only the final integration transaction.''','''When the user explicitly requests `integration-submit`, the integration lock serializes only that final integration transaction.''')
          s=s.replace('''## Dependency reuse

          Worktree creation does not run `npm ci`.''','''## Optional managed-worktree dependency reuse

          When an isolated worktree was explicitly requested, worktree creation does not run `npm ci`.''')
          s=s.replace('''`tools/local-agent/codex_test.py` validates an authenticated local Codex worker as a real gateway agent. The test creates an isolated agent worktree, runs Codex concurrently with a reviewer peer, requires the live monitor to show both a local agent and a cloud probe, records a checkpoint/handoff, validates the exact changed paths, creates a trusted local branch commit, and submits that commit only to `integration`.''','''`tools/local-agent/codex_test.py` is an explicit Gateway test harness, not the normal local-agent workflow. When deliberately run, it validates an authenticated Codex worker in isolated managed mode, including worktree, checkpoint/handoff, commit-scope, and optional `integration` behavior.''')
          s=s.replace('''`tools/local-agent/install.sh` installs the committed runtime without dependency installation. The legacy GitHub request/workflow transport is not part of normal operation after migration. The committed bootstrap workflow is manual-only (`workflow_dispatch`) and exists only to install or refresh the persistent runtime; it is not the per-command transport.''','''`tools/local-agent/install.sh` installs or refreshes optional local-agent infrastructure without dependency installation. The committed bootstrap workflow is manual-only (`workflow_dispatch`), is the primary remote bootstrap/entry path, and installs from the canonical checkout `/home/hesham/gova` without creating or resetting an integration worktree. Bootstrap does not opt normal local agents into Gateway-managed execution.''')
          s=s.replace('''## Failure recovery

          - Agent/client disconnect: command continues and logs remain queryable.''','''## Optional managed-mode failure recovery

          These cases apply only to explicitly selected Gateway-managed execution.

          - Agent/client disconnect: command continues and logs remain queryable.''')
          p.write_text(s)

          # 4) Connection guide: make the entry path and execution path unambiguous.
          p=root/'docs/06-super-admin-and-operations/local-agent-connection.md'
          p.write_text('''# GOVA Local Agent Connection Guide

          This document defines the current approved remote-entry and local-execution model.

          ## 1. Primary remote entry path

          The primary path for preparing or recovering the local device is:

          ```text
          Cloud agent / operator
            -> GitHub workflow_dispatch
            -> local-agent-bootstrap.yml
            -> self-hosted GitHub Runner
            -> /home/hesham/gova
          ```

          GitHub reaches the physical device through the self-hosted Runner. The Runner must treat `/home/hesham/gova` as the real project checkout and must not replace it with an isolated Actions checkout.

          ## 2. Default local execution

          After the local agent is running on the device, normal work is direct:

          ```text
          Local agent
            -> /home/hesham/gova
            -> inspect / edit / verify requested files directly
          ```

          Normal local work must not automatically:

          - call `127.0.0.1:8765` or register with `gova-agent-gateway`;
          - create `/home/hesham/gova-agents/<agent>/<task>`;
          - create an `agent/*` branch;
          - acquire Gateway locks/checkpoints/handoffs;
          - submit results to `integration`;
          - commit, push, or deploy.

          Existing local modifications must be preserved.

          ## 3. Optional Gateway-managed mode

          `gova-agent-gateway.service`, its localhost/public transport, runtime database, worktree APIs, and `integration-submit` remain available as explicit tools. They are used only when the user specifically requests Gateway-controlled execution, isolated worktrees, multi-agent coordination, or integration submission.

          The fact that the Gateway service is installed or running does not authorize an agent to use it.

          ## 4. Branch model

          The only recognized remote branches are `main` and `integration`.

          - `main`: production/release branch and normal canonical local checkout.
          - `integration`: used only when the user explicitly requests aggregation/integration work.

          A normal local task does not pass through `integration` and does not create a task branch.

          ## 5. Bootstrap contract

          `.github/workflows/local-agent-bootstrap.yml` is manual-only (`workflow_dispatch`), runs on the Gova self-hosted Runner, reuses the host checkout/toolchain, and installs infrastructure from `/home/hesham/gova`. It must not create or reset `/home/hesham/gova-agents/integration`.

          Bootstrap is an entry/recovery operation, not permission to route subsequent local work through the Gateway.

          ## 6. Short reference

          Default:

          ```text
          GitHub workflow_dispatch -> Self-hosted Runner -> /home/hesham/gova
                                                       -> direct local edits
          ```

          Explicit managed mode only:

          ```text
          User explicitly requests managed/isolation mode
            -> gova-agent-gateway
            -> optional worktree / locks / task state / integration-submit
          ```
          '''.replace('          ',''))

          # 5) Architecture decision revised to the current direct-edit policy.
          p=root/'docs/01-architecture/09-decisions/ADR-0006-main-only-branch.md'
          p.write_text('''# ADR-0006: Fixed Two-Branch Repository Model and Direct Local Editing

          ## Status

          Accepted; local-agent execution policy revised 2026-09-04.

          ## Context

          The repository must keep remote branch sprawl under control while allowing local agents to work naturally against the real device checkout. Earlier revisions made the persistent Gateway, per-task worktrees, and `integration-submit` the normal execution path. That added indirection for ordinary local edits and could move work away from the files the user was actually inspecting.

          ## Decision

          1. The only recognized remote branches are `main` and `integration`.
          2. `main` remains the production/release branch and `/home/hesham/gova` is the canonical local checkout.
          3. Default local-agent execution edits `/home/hesham/gova` directly in its current branch and working tree while preserving pre-existing local changes.
          4. A normal local task does not automatically create a worktree, `agent/*` branch, Gateway task/session, lock/checkpoint/handoff, integration submission, commit, push, or deployment.
          5. GitHub `workflow_dispatch` through `.github/workflows/local-agent-bootstrap.yml` is the primary remote bootstrap/entry path to prepare or recover the local device.
          6. The bootstrap installs from `/home/hesham/gova` and must not create or reset an integration worktree.
          7. `gova-agent-gateway`, `/home/hesham/gova-agents/`, and `integration-submit` remain explicit opt-in capabilities for user-requested managed/isolation or aggregation work.
          8. `integration` is used only when the user explicitly requests integration/aggregation; it is not a mandatory completion lane.
          9. No third remote ref, wildcard branch namespace, request branch, rescue branch, staging branch, or provider-generated branch is allowed.

          ## Enforcement

          - `.githooks/pre-push.d/10-main-only` allows only `refs/heads/main` and `refs/heads/integration`.
          - `scripts/block-branch-creation.ts` keeps the remote two-branch rule.
          - `scripts/github-ci-policy.ts` requires the bootstrap to use `/home/hesham/gova` and rejects integration-worktree bootstrap behavior.
          - Agent instruction surfaces explicitly prohibit automatic Gateway/worktree/integration/commit/push/deploy transitions.

          ## Optional managed runtime

          The implementation under `tools/local-agent/`, the runtime database under `/home/hesham/.local/share/gova-agent-runtime/`, and `gova-agent-gateway.service` are retained. They do not define the default execution path and are activated for a task only by explicit user intent.

          ## Consequences

          Local agents modify the same files the user sees on the device. GitHub remains a reliable bootstrap entry point. Isolation, multi-agent coordination, and integration transactions remain available without being imposed on ordinary local work.
          '''.replace('          ',''))

          # 6) docs/09 keeps historical evidence, but must label and phrase it as historical.
          p=root/'docs/09-agent-knowledge/local-agent-runtime.md'
          s=p.read_text()
          s=s.replace('## Final Migration State (2026-09-02)','## Historical Migration State (2026-09-02, superseded by the 2026-09-04 policy)',1)
          s=s.replace('- Normal agent commands use the persistent `gova-agent-gateway` service and do not dispatch GitHub Actions jobs.','- Historical state at that checkpoint: normal agent commands used the persistent `gova-agent-gateway` service. This is no longer the default after the 2026-09-04 policy above.',1)
          s=s.replace('- New task worktrees start from the latest `origin/integration`, so every new agent sees all previously integrated work.','- Historical state at that checkpoint: new task worktrees started from `origin/integration`. Current default local work does not create a task worktree.',1)
          s=s.replace('- Normal completion integrates local commits through the gateway into `integration`; promotion from `integration` to `main` separate.','- Historical state at that checkpoint: completion integrated local commits through the Gateway into `integration`. Current default completion leaves verified edits local unless the user requests a Git operation.',1)
          p.write_text(s)
          PY

          echo '=== VERIFY NO ACTIVE OLD CONTRACT ==='
          active=(AGENTS.md CLAUDE.md GEMINI.md .agents/rules/agent-instructions.md docs/06-super-admin-and-operations/local-agent-runtime.md docs/06-super-admin-and-operations/local-agent-connection.md docs/01-architecture/09-decisions/ADR-0006-main-only-branch.md scripts/github-ci-policy.ts .github/workflows/local-agent-bootstrap.yml)
          forbidden=(
            'Normal agent completion integrates into `integration`'
            'Normal agent work uses `gova-agent-gateway`'
            'GitHub Actions is not the normal command transport'
            'Create a task worktree from the current `origin/integration` baseline'
            'Local agent bootstrap must install from the integration worktree'
            'GOVA_AGENT_REPO=/home/hesham/gova-agents/integration'
          )
          for q in "${forbidden[@]}"; do
            if grep -nF "$q" "${active[@]}"; then echo "FORBIDDEN_ACTIVE_CONTRACT=$q" >&2; exit 30; fi
          done
          grep -nF 'Default local-agent execution is direct editing' AGENTS.md CLAUDE.md GEMINI.md .agents/rules/agent-instructions.md
          grep -nF 'GOVA_AGENT_REPO=/home/hesham/gova' .github/workflows/local-agent-bootstrap.yml
          ! grep -nF '/home/hesham/gova-agents/integration' .github/workflows/local-agent-bootstrap.yml
          grep -nF 'must not create or use the integration worktree' scripts/github-ci-policy.ts

          echo '=== POLICY / DOC / ARCHITECTURE CHECKS ==='
          export DOCS_CONTRACT_CHANGE=1
          npm run docs:mutability:check
          npx tsx scripts/github-ci-policy.ts
          npm run docs:ci
          npm run architecture:check

          echo '=== REMOVE NOW-UNNEEDED PERSISTENT INTEGRATION WORKTREE IF CLEAN ==='
          if [ -d /home/hesham/gova-agents/integration ]; then
            test -z "$(git -C /home/hesham/gova-agents/integration status --porcelain --untracked-files=all)"
            git -C "$ROOT" worktree remove /home/hesham/gova-agents/integration
          fi
          git -C "$ROOT" worktree prune
          if git -C "$ROOT" show-ref --verify --quiet refs/heads/integration; then
            git -C "$ROOT" branch -D integration
          fi

          echo '=== FINAL LIVE STATE ==='
          git -C "$ROOT" status --short --branch
          echo '--- worktrees'
          git -C "$ROOT" worktree list --porcelain
          echo '--- agent branches'
          git -C "$ROOT" for-each-ref --format='%(refname:short)' refs/heads/agent/
          echo '--- runtime counts'
          python3 - <<'PY'
          from pathlib import Path
          import sqlite3
          p=Path('/home/hesham/.local/share/gova-agent-runtime/runtime.sqlite3')
          if not p.exists(): print('RUNTIME_DB=absent')
          else:
            c=sqlite3.connect(p)
            tabs=('agents','sessions','tasks','commands','locks','messages','handoffs','events')
            out={t:c.execute(f'select count(*) from {t}').fetchone()[0] for t in tabs}
            c.close(); print('RUNTIME_COUNTS='+repr(out))
            if any(out.values()): raise SystemExit('runtime is not idle/empty')
          PY
          echo '--- local routing hooks'
          if grep -RInE --binary-files=without-match '(127\.0\.0\.1:8765|/v1/agent/register|/v1/workspace/create|integration-submit|gova-agent-gateway)' .claude 2>/dev/null; then
            echo 'ACTIVE_PROJECT_CLAUDE_ROUTING_REFERENCE_FOUND' >&2; exit 31
          fi
          echo '--- protected/direct-edit diff files'
          git diff --name-only
          echo DEEP_DIRECT_LOCAL_EDIT_REPAIR=PASS
