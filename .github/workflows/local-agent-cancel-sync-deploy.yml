name: local-agent-cancel-sync-deploy
on:
  push:
    branches: [main]
    paths:
      - 'tools/local-agent/.cancel-sync-deploy-trigger'
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel unintended deploy-main runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 33768672903 33769198961; do
            curl -fsS -L -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id/cancel" >/dev/null || true
          done
