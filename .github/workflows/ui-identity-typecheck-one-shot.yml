name: ui-identity-typecheck-one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ui-identity-typecheck-one-shot.yml

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npm run typecheck
      # Stage 82 rerun marker.
