ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    // Declared here so the app module and the Capacitor push plugin resolve the
    // same Firebase Messaging artifact. The app needs it on its own compile
    // classpath because AsolPushMessagingService — the application-owned
    // FirebaseMessagingService that persists a push before displaying it —
    // lives in the app module, and the plugin exposes the library only as an
    // `implementation` dependency. Keep in step with the plugin's default in
    // node_modules/@capacitor/push-notifications/android/build.gradle.
    firebaseMessagingVersion = '25.0.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}