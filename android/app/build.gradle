apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv("ASOL_ANDROID_KEYSTORE_FILE")
def releaseKeystorePassword = System.getenv("ASOL_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ASOL_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ASOL_ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "hgh.asol.app"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file("../${releaseKeystorePath}")
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "hgh.asol.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 204
        versionName "0.2.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Instrumented tests run against the variant the test device actually
    // carries. Android generates androidTest tasks for this build type alone,
    // so without it there is no `connectedDebugR8AndroidTest` and the suite
    // would silently exercise unminified code the app never ships.
    testBuildType "debugR8"
    buildTypes {
        debugR8 {
            initWith debug
            debuggable true
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            // The release rules, plus the few keeps the instrumented tests need
            // to reach app types by name. Release itself keeps nothing extra.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-testable-app.pro'
            // Applied to the instrumentation APK, which AGP must also minify
            // because it links against this obfuscated app.
            testProguardFiles 'proguard-rules-test-apk.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        releaseNoR8 {
            initWith release
            minifyEnabled false
            shrinkResources false
            versionNameSuffix "-nor8"
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def noR8TaskRequested = graph.allTasks.any { task ->
        task.path == ':app:bundleReleaseNoR8' || task.path == ':app:assembleReleaseNoR8'
    }
    if (noR8TaskRequested && project.findProperty('asol.allowNoR8') != 'true') {
        throw new GradleException('ReleaseNoR8 is diagnostic-only. Re-run with -Pasol.allowNoR8=true.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // NotificationCompat / NotificationManagerCompat, used by the
    // application-owned push service to post on the ASOL channels.
    implementation "androidx.core:core:$androidxCoreVersion"
    // Firebase Messaging on the app's own compile classpath: ASOL declares its
    // own FirebaseMessagingService (AsolPushMessagingService) so an Android push
    // is persisted to the local encrypted inbox before it is displayed. The
    // Capacitor push plugin depends on the same artifact, but as an
    // `implementation` dependency it is not exposed to consumers.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
